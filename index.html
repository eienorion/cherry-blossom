    <style>
      /* Full-screen luminous white canvas using dynamic viewport units & safe areas */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;

        width: 100%;
        height: 100%;
        touch-action: none;

        background: linear-gradient(

          rgba(255, 255, 255, 0.96) 0%,
          rgba(253, 249, 248, 0.92) 100%
        );
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(218, 165, 180, 0.4);
        box-shadow:
          0 20px 48px -12px rgba(60, 45, 50, 0.1),

          inset 0 1px 0 rgba(255, 255, 255, 1);
        will-change: transform, opacity;
      }

      .frosted-pill {
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.96) 0%,

        box-shadow:
          0 8px 20px -4px rgba(60, 45, 50, 0.07),
          inset 0 1px 0 rgba(255, 255, 255, 1);
      }

      /* GPU Compositor-only Tooltip Layer (uses translate3d instead of top/left) */
      #hoverTooltip {
        left: 0;
        top: 0;
        will-change: transform, opacity;
        transition: opacity 0.18s ease-out;
      }

      /* Pure GPU Compositor Entrance Animation (translate3d + scale + opacity only) */
      @keyframes sereneCardFade {
        0% {
          opacity: 0;
          transform: translate3d(0, 18px, 0) scale(0.97);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      .animate-serene-reveal {
        animation: sereneCardFade 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

    <script>
      /**
       * ============================================================================
       * 10 THINGS I LIKE ABOUT YOU — NOTES DATA
       * ============================================================================
       */
      const THINGS_I_LIKE = [
        {
          id: 1,

          source: "Reason #01 of 10",
        },
        {

        },
        {

        },
        {

        },
        {

          text: "Her lips, with that subtle shade of pink.",

        },
        {

        },
        {

          source: "Reason #10 of 10",
        },
      ];

      const DECORATIVE_PALETTES = [
        {
          tip: "#FFFFFF",
          mid: "#FADADD",
          center: "#F4A7B9",
          stamen: "#C99A4E",
        },
        {
          tip: "#FFFFFF",
          mid: "#FCE8EC",
          center: "#E67E96",
          stamen: "#C99A4E",
        },
        {
          tip: "#FFF9FA",
          mid: "#F4A7B9",
          center: "#FFFFFF",
          stamen: "#B8893E",
        },
        {
          tip: "#FFFFFF",
          mid: "#FADADD",
          center: "#FFFFFF",
          stamen: "#C99A4E",
        },
      ];

      /**
       * ============================================================================
       * 1. OFFSCREEN CANVAS SPRITE CACHE (RETINA DPR <= 2)
       * Pre-renders all complex Bezier blossom curves, radial gradients, soft
       * shadows, buds, single fallen petals, and pollen motes ONCE at startup so
       * the 60 FPS loop uses pure GPU-accelerated ctx.drawImage() calls.
       * ============================================================================
       */
      class SakuraSpriteCache {
        constructor(dpr) {
          this.dpr = dpr;
          this.decorativeBlossoms = [];
          this.budSprite = null;
          this.interactiveBlossom = null;
          this.interactiveBlossomHover = null;
          this.singlePetals = [];
          this.pollenSprites = {};
          this.rebuild(dpr);
        }

        rebuild(dpr) {
          this.dpr = dpr;

          // Pre-render the 4 decorative blossom color variations
          this.decorativeBlossoms = DECORATIVE_PALETTES.map((pal) =>
            this.bakeBlossomSprite(pal, {
              isInteractive: false,
              hoverBoost: 0,
              shadowOffsetY: 3,
              shadowBlur: 6,
              shadowAlpha: 0.065,
            }),
          );

          // Pre-render interactive blossom (default & hovered states) at high resolution
          const interactivePal = {
            center: "#FFFFFF",
            mid: "#FADADD",
            tip: "#FFFFFF",
            stamen: "#C99A4E",
          };
          this.interactiveBlossom = this.bakeBlossomSprite(interactivePal, {
            isInteractive: true,
            hoverBoost: 0,
            shadowOffsetY: 5,
            shadowBlur: 10,
            shadowAlpha: 0.09,
          });
          this.interactiveBlossomHover = this.bakeBlossomSprite(interactivePal, {
            isInteractive: true,
            hoverBoost: 1,
            shadowOffsetY: 9,
            shadowBlur: 16,
            shadowAlpha: 0.14,
          });

          // Pre-render flower bud sprite
          this.budSprite = this.bakeBudSprite();

          // Pre-render the 3 single fallen petal variations ("kelopak gugur putus")
          this.singlePetals = [0, 1, 2].map((tone) =>
            this.bakeSinglePetalSprite(tone),
          );

          // Pre-render sunlit gold & blush pollen mote sprites
          this.pollenSprites.gold = this.bakePollenSprite(
            "rgba(214, 174, 108, 0.32)",
          );
          this.pollenSprites.blush = this.bakePollenSprite(
            "rgba(244, 167, 185, 0.36)",
          );
        }

        bakeBlossomSprite(palette, options) {
          const {
            isInteractive = false,
            hoverBoost = 0,
            shadowOffsetY = 5,
            shadowBlur = 10,
            shadowAlpha = 0.09,
          } = options;

          // Bake at logical radius 40px (up to 80px physical @ 2x DPR) so scaling stays crisp
          const logicalRadius = 40;
          const logicalBox = 116;
          const canvas = document.createElement("canvas");
          canvas.width = Math.ceil(logicalBox * this.dpr);
          canvas.height = Math.ceil(logicalBox * this.dpr);

          const ctx = canvas.getContext("2d");
          ctx.scale(this.dpr, this.dpr);
          ctx.translate(logicalBox * 0.5, logicalBox * 0.5);

          const radius = logicalRadius;

          ctx.save();
          ctx.shadowColor = `rgba(60, 45, 50, ${shadowAlpha})`;
          ctx.shadowBlur = shadowBlur;
          ctx.shadowOffsetX = shadowOffsetY * 0.35;
          ctx.shadowOffsetY = shadowOffsetY;

          for (let p = 0; p < 5; p++) {
            ctx.save();
            ctx.rotate((p * Math.PI * 2) / 5);

            const pGrad = ctx.createRadialGradient(
              0,
              -radius * 0.12,
              radius * 0.05,
              0,
              -radius * 0.55,
              radius * 1.02,
            );
            pGrad.addColorStop(0, palette.center);
            pGrad.addColorStop(0.46, palette.mid);
            pGrad.addColorStop(0.88, palette.tip);
            pGrad.addColorStop(1, "#FFFFFF");

            ctx.fillStyle = pGrad;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(
              -radius * 0.44,
              -radius * 0.25,
              -radius * 0.52,
              -radius * 0.78,
              -radius * 0.14,
              -radius * 0.98,
            );
            ctx.lineTo(0, -radius * 0.85);
            ctx.lineTo(radius * 0.14, -radius * 0.98);
            ctx.bezierCurveTo(
              radius * 0.52,
              -radius * 0.78,
              radius * 0.44,
              -radius * 0.25,
              0,
              0,
            );
            ctx.closePath();
            ctx.fill();

            ctx.shadowColor = "transparent";
            ctx.strokeStyle = isInteractive
              ? `rgba(230, 126, 150, ${0.42 + hoverBoost * 0.28})`
              : "rgba(244, 167, 185, 0.38)";
            ctx.lineWidth = isInteractive ? 1.1 : 0.85;
            ctx.stroke();

            ctx.restore();
          }

          ctx.shadowColor = "transparent";

          // Floral center
          ctx.fillStyle = isInteractive ? "#FFFFFF" : "#FADADD";
          ctx.beginPath();
          ctx.arc(0, 0, radius * 0.17, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "rgba(230, 126, 150, 0.45)";
          ctx.lineWidth = 0.8;
          ctx.stroke();

          // Golden-ivory stamens
          const stamenCount = isInteractive ? 9 : 6;
          for (let s = 0; s < stamenCount; s++) {
            const ang = (s * Math.PI * 2) / stamenCount + 0.25;
            const sLen = radius * (0.28 + (s % 2) * 0.09);
            const sx = Math.cos(ang) * sLen;
            const sy = Math.sin(ang) * sLen;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(sx, sy);
            ctx.strokeStyle = "rgba(230, 126, 150, 0.55)";
            ctx.lineWidth = 0.85;
            ctx.stroke();

            ctx.fillStyle = palette.stamen || "#C99A4E";
            ctx.beginPath();
            ctx.arc(sx, sy, Math.max(1.2, radius * 0.055), 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();

          return {
            canvas,
            logicalRadius,
            logicalBox,
            ratio: logicalBox / logicalRadius,
          };
        }

        bakeBudSprite() {
          const logicalRadius = 18;
          const logicalBox = 48;
          const canvas = document.createElement("canvas");
          canvas.width = Math.ceil(logicalBox * this.dpr);
          canvas.height = Math.ceil(logicalBox * this.dpr);

          const ctx = canvas.getContext("2d");
          ctx.scale(this.dpr, this.dpr);
          ctx.translate(logicalBox * 0.5, logicalBox * 0.5);

          ctx.fillStyle = "#FADADD";
          ctx.strokeStyle = "rgba(230, 126, 150, 0.45)";
          ctx.lineWidth = 1.0;
          ctx.beginPath();
          ctx.ellipse(
            0,
            0,
            logicalRadius * 0.34,
            logicalRadius * 0.56,
            0,
            0,
            Math.PI * 2,
          );
          ctx.fill();
          ctx.stroke();

          return {
            canvas,
            logicalRadius,
            logicalBox,
            ratio: logicalBox / logicalRadius,
          };
        }

        bakeSinglePetalSprite(tone) {
          const s = 18;
          const logicalBox = 52;
          const canvas = document.createElement("canvas");
          canvas.width = Math.ceil(logicalBox * this.dpr);
          canvas.height = Math.ceil(logicalBox * this.dpr);

          const ctx = canvas.getContext("2d");
          ctx.scale(this.dpr, this.dpr);
          ctx.translate(logicalBox * 0.5, logicalBox * 0.5);

          ctx.shadowColor = "rgba(60, 45, 50, 0.08)";
          ctx.shadowBlur = 5;
          ctx.shadowOffsetY = 3;

          const grad = ctx.createRadialGradient(0, s * 0.25, 0.5, 0, 0, s * 1.1);
          if (tone === 0) {
            grad.addColorStop(0, "#F8C8D6");
            grad.addColorStop(0.65, "#FADADD");
            grad.addColorStop(1, "#FFFFFF");
          } else if (tone === 1) {
            grad.addColorStop(0, "#F4A7B9");
            grad.addColorStop(0.6, "#FCE8EE");
            grad.addColorStop(1, "#FFFFFF");
          } else {
            grad.addColorStop(0, "#FADADD");
            grad.addColorStop(0.7, "#FFF6F8");
            grad.addColorStop(1, "#FFFFFF");
          }

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(0, s);
          ctx.bezierCurveTo(
            -s * 0.72,
            s * 0.35,
            -s * 0.78,
            -s * 0.62,
            -s * 0.2,
            -s * 0.98,
          );
          ctx.lineTo(0, -s * 0.76);
          ctx.lineTo(s * 0.2, -s * 0.98);
          ctx.bezierCurveTo(s * 0.78, -s * 0.62, s * 0.72, s * 0.35, 0, s);
          ctx.closePath();
          ctx.fill();

          ctx.shadowColor = "transparent";
          ctx.strokeStyle = "rgba(230, 138, 166, 0.44)";
          ctx.lineWidth = 0.95;
          ctx.stroke();

          return {
            canvas,
            logicalRadius: s,
            logicalBox,
            ratio: logicalBox / s,
          };
        }

        bakePollenSprite(color) {
          const logicalBox = 16;
          const canvas = document.createElement("canvas");
          canvas.width = Math.ceil(logicalBox * this.dpr);
          canvas.height = Math.ceil(logicalBox * this.dpr);

          const ctx = canvas.getContext("2d");
          ctx.scale(this.dpr, this.dpr);
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(8, 8, 5, 0, Math.PI * 2);
          ctx.fill();

          return canvas;
        }
      }

      /**
       * ============================================================================
       * 2. OBJECT POOL FOR SINGLE SAKURA PETALS ("KELOPAK GUGUR PUTUS")
       * Pre-allocates a fixed pool bounded by device capability (50 on low-end
       * mobile devices, 110 on standard/high-end devices) and recycles petals
       * in-place when leaving the viewport to eliminate GC spikes & memory leaks.
       * ============================================================================
       */
      class PetalObjectPool {
        constructor(capacity) {
          this.capacity = capacity;
          this.items = new Array(capacity);
          for (let i = 0; i < capacity; i++) {
            this.items[i] = {
              active: false,
              persistent: true,
              x: 0,
              y: 0,
              vx: 0,
              vy: 0,
              size: 7,
              rot: 0,
              vRot: 0,
              flipPhase: 0,
              flipSpeed: 2,
              swayPhase: 0,
              swayAmp: 14,
              alpha: 0.9,
              delay: 0,
              tone: 0,
            };
          }
        }

        acquire() {
          for (let i = 0; i < this.capacity; i++) {
            if (!this.items[i].active) {
              this.items[i].active = true;
              return this.items[i];
            }
          }
          return null;
        }

        release(petal) {
          petal.active = false;
        }

        clearAll() {
          for (let i = 0; i < this.capacity; i++) {
            this.items[i].active = false;
          }
        }

        rescalePositions(scaleX, scaleY) {
          for (let i = 0; i < this.capacity; i++) {
            const p = this.items[i];
            if (p.active) {
              p.x *= scaleX;
              p.y *= scaleY;
            }
          }
        }
      }

      /**
       * ============================================================================
       * PROCEDURAL SUMMER BREEZE & HARMONIC CHIME ENGINE (WEB AUDIO API)
       * ============================================================================
       */
      class SummerBreezeAudio {
        constructor() {
          this.ctx = null;
          this.windGain = null;
          this.windFilter = null;
        }

        unlock() {
          try {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (!AudioCtx) return;
              this.ctx = new AudioCtx();

              const bufferSize = 2 * this.ctx.sampleRate;
              const noiseBuffer = this.ctx.createBuffer(
                1,
                bufferSize,
                this.ctx.sampleRate,
              );
              const output = noiseBuffer.getChannelData(0);
              let b0 = 0,
                b1 = 0,
                b2 = 0;
              for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                b0 = 0.99765 * b0 + white * 0.099046;
                b1 = 0.963 * b1 + white * 0.2965164;
                b2 = 0.57 * b2 + white * 1.0526913;
                output[i] = (b0 + b1 + b2 + white * 0.1848) * 0.16;
              }

              const noiseSource = this.ctx.createBufferSource();
              noiseSource.buffer = noiseBuffer;
              noiseSource.loop = true;

              this.windFilter = this.ctx.createBiquadFilter();
              this.windFilter.type = "bandpass";
              this.windFilter.frequency.value = 310;
              this.windFilter.Q.value = 1.4;

              this.windGain = this.ctx.createGain();
              this.windGain.gain.value = 0.0001;

              noiseSource.connect(this.windFilter);
              this.windFilter.connect(this.windGain);
              this.windGain.connect(this.ctx.destination);
              noiseSource.start(0);
            }

            if (this.ctx.state === "suspended") {
              this.ctx.resume();
            }
          } catch (err) {
            // Ignore audio restrictions silently
          }
        }

        playWarmBreezeLift() {
          this.unlock();
          if (!this.ctx || !this.windFilter || !this.windGain) return;
          try {
            const now = this.ctx.currentTime;
            this.windFilter.frequency.cancelScheduledValues(now);
            this.windFilter.frequency.setValueAtTime(300, now);
            this.windFilter.frequency.exponentialRampToValueAtTime(
              560,
              now + 1.1,
            );
            this.windFilter.frequency.exponentialRampToValueAtTime(
              310,
              now + 2.8,
            );

            this.windGain.gain.cancelScheduledValues(now);
            this.windGain.gain.setValueAtTime(0.012, now);
            this.windGain.gain.linearRampToValueAtTime(0.055, now + 0.9);
            this.windGain.gain.exponentialRampToValueAtTime(0.012, now + 2.9);

            const notes = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
            const freq = notes[Math.floor(Math.random() * notes.length)];
            this.playGentleChime(freq, 0.055);
          } catch (err) {
            // Ignore
          }
        }

        playGentleChime(freq, volume = 0.055) {
          this.unlock();
          if (!this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.003, now + 2.2);

            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(volume, now + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 2.6);
          } catch (err) {
            // Ignore
          }
        }

        playScatterWhisper() {
          this.unlock();
          if (!this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            if (this.windFilter && this.windGain) {
              this.windFilter.frequency.cancelScheduledValues(now);
              this.windFilter.frequency.setValueAtTime(280, now);
              this.windFilter.frequency.exponentialRampToValueAtTime(
                640,
                now + 1.4,
              );
              this.windFilter.frequency.exponentialRampToValueAtTime(
                310,
                now + 3.4,
              );

              this.windGain.gain.cancelScheduledValues(now);
              this.windGain.gain.setValueAtTime(0.015, now);
              this.windGain.gain.linearRampToValueAtTime(0.075, now + 1.1);
              this.windGain.gain.exponentialRampToValueAtTime(0.015, now + 3.5);
            }

            [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
              setTimeout(() => this.playGentleChime(f, 0.045), idx * 140);
            });
          } catch (err) {
            // Ignore
          }
        }
      }

      /**
       * ============================================================================
       * MAIN INTERACTIVE SAKURA EXPERIENCE (OPTIMIZED 60 FPS ENGINE)
       * ============================================================================
       */
      class SakuraExperience {
        constructor() {
          this.canvas = document.getElementById("sakuraCanvas");
          this.ctx = this.canvas.getContext("2d", { alpha: false });
          this.sound = new SummerBreezeAudio();

          this.width = window.innerWidth;
          this.height = window.innerHeight;
          // 1. Cap DPR at 2 to prevent 3x/4x mobile GPU overdraw while keeping Retina crispness
          this.dpr = Math.min(window.devicePixelRatio || 1, 2);

          // 2. Dynamic particle budget based on hardwareConcurrency (50 low-end / 110 high-end)
          const cpuCores = navigator.hardwareConcurrency || 4;
          this.isLowEndDevice =
            cpuCores <= 4 || (this.width < 640 && cpuCores <= 6);
          this.maxActivePetals = this.isLowEndDevice ? 50 : 110;

          // Offscreen caches
          this.sprites = new SakuraSpriteCache(this.dpr);
          this.bgCanvas = document.createElement("canvas");
          this.petalPool = new PetalObjectPool(this.maxActivePetals);

          // States: 'BLOOMING' -> 'SCATTERED'
          this.state = "BLOOMING";
          this.branchesBare = false;

          // Procedural tree growth timeline (~2.6 seconds)
          this.growthStartTime = performance.now();
          this.growthDuration = 2600;
          this.growthProgress = 0;

          // Tree geometry & blossoms
          this.branches = [];
          this.decorativeBlossoms = [];
          this.interactiveBlossoms = [];

          // State tracking for the 10 blossoms
          this.releasedIds = new Set();
          this.pluckedIds = new Set();

          // Active detached blossom gliding gently toward the viewer
          this.driftingBlossom = null;

          this.breezeWave = 0;
          this.breezeRibbons = [];

          // Sunlit summer pollen motes
          this.pollenMotes = [];

          // Pointer, Tooltip & Throttling state (36ms minimum interval)
          this.pointer = { x: -9999, y: -9999 };
          this.lastPointerMoveTime = 0;
          this.moveThrottleMs = 36;
          this.isTouchDevice =
            "ontouchstart" in window || (navigator.maxTouchPoints || 0) > 0;
          this.hoveredBlossom = null;
          this.tooltipEl = document.getElementById("hoverTooltip");
          this.lastTooltipX = -9999;
          this.lastTooltipY = -9999;

          this.activeQuote = null;
          this.lastTimestamp = performance.now();

          this.bindEvents();
          this.handleResize(true);
          this.initSummerAtmosphere();
        }

        bindEvents() {
          window.addEventListener("resize", () => this.handleResize(false));
          window.addEventListener("orientationchange", () => {
            setTimeout(() => this.handleResize(false), 120);
          });
          if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", () =>
              this.handleResize(false),
            );
          }

          // Throttled pointermove / touchmove handler (36ms interval)
          const handleThrottledMove = (clientX, clientY, isTouch) => {
            const now = performance.now();
            if (now - this.lastPointerMoveTime < this.moveThrottleMs) return;
            this.lastPointerMoveTime = now;

            if (!isTouch) {
              this.pointer.x = clientX;
              this.pointer.y = clientY;
              this.updateHoverState();
            }

            // Spawn at most 1 gentle transient breeze petal from the pool on swipe/glide
            if (!this.isModalOpen() && Math.random() < 0.45) {
              this.spawnTransientBreezePetal(clientX, clientY);
            }
          };

          this.canvas.addEventListener(
            "pointermove",
            (e) => {
              handleThrottledMove(
                e.clientX,
                e.clientY,
                e.pointerType === "touch",
              );
            },
            { passive: true },
          );

          this.canvas.addEventListener(
            "touchmove",
            (e) => {
              if (e.touches && e.touches.length > 0) {
                const t = e.touches[0];
                handleThrottledMove(t.clientX, t.clientY, true);
              }
            },
            { passive: true },
          );

          this.canvas.addEventListener("pointerleave", () => {
            this.pointer.x = -9999;
            this.pointer.y = -9999;
            this.updateHoverState();
          });

          this.canvas.addEventListener("pointerdown", (e) => {
            this.sound.unlock();
            this.pointer.x = e.clientX;
            this.pointer.y = e.clientY;

            if (this.isModalOpen()) return;

            if (
              this.state === "BLOOMING" &&
              !this.branchesBare &&
              !this.driftingBlossom
            ) {
              const target = this.findClosestBlossom(e.clientX, e.clientY);
              if (target) {
                this.releaseBlossom(target);
              }
            }
          });

          // Note modal controls
          document
            .getElementById("closeQuoteBtn")
            .addEventListener("click", () => this.closeQuoteModal());
          document
            .getElementById("continueTreeBtn")
            .addEventListener("click", () => this.closeQuoteModal());
          document
            .getElementById("quoteModal")
            .addEventListener("click", (e) => {
              if (e.target.id === "quoteModal") {
                this.closeQuoteModal();
              }
            });

          window.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && this.isModalOpen()) {
              this.closeQuoteModal();
            }
          });
        }

        isModalOpen() {
          return !document
            .getElementById("quoteModal")
            .classList.contains("hidden");
        }

        getViewportDimensions() {
          const vv = window.visualViewport;
          return {
            w: vv ? vv.width : window.innerWidth,
            h: vv ? vv.height : window.innerHeight,
          };
        }

        /**
         * Pre-render static luminous summer daylight backdrop onto an offscreen canvas
         */
        rebuildBackgroundCache() {
          this.bgCanvas.width = Math.floor(this.width * this.dpr);
          this.bgCanvas.height = Math.floor(this.height * this.dpr);

          const bgCtx = this.bgCanvas.getContext("2d", { alpha: false });
          bgCtx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

          const bgGrad = bgCtx.createLinearGradient(
            0,
            0,
            this.width,
            this.height,
          );
          bgGrad.addColorStop(0, "#FFFFFF");
          bgGrad.addColorStop(0.55, "#FEFCFB");
          bgGrad.addColorStop(1, "#FAF6F5");
          bgCtx.fillStyle = bgGrad;
          bgCtx.fillRect(0, 0, this.width, this.height);

          const sunGrad = bgCtx.createRadialGradient(
            this.width * 0.36,
            this.height * 0.34,
            10,
            this.width * 0.36,
            this.height * 0.34,
            Math.max(this.width, this.height) * 0.65,
          );
          sunGrad.addColorStop(0, "rgba(255, 246, 248, 0.72)");
          sunGrad.addColorStop(0.5, "rgba(252, 248, 246, 0.25)");
          sunGrad.addColorStop(1, "rgba(255, 255, 255, 0)");
          bgCtx.fillStyle = sunGrad;
          bgCtx.fillRect(0, 0, this.width, this.height);
        }

        handleResize(isInitial = false) {
          const { w, h } = this.getViewportDimensions();
          const prevW = this.width || w;
          const prevH = this.height || h;
          const prevDpr = this.dpr;

          this.width = w;
          this.height = h;
          this.dpr = Math.min(window.devicePixelRatio || 1, 2);

          this.canvas.width = Math.floor(this.width * this.dpr);
          this.canvas.height = Math.floor(this.height * this.dpr);
          this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
          this.ctx.imageSmoothingEnabled = true;
          this.ctx.imageSmoothingQuality = "high";

          if (this.dpr !== prevDpr) {
            this.sprites.rebuild(this.dpr);
          }
          this.rebuildBackgroundCache();
          this.buildSakuraTree();

          if (!isInitial && prevW > 0 && prevH > 0) {
            const scaleX = this.width / prevW;
            const scaleY = this.height / prevH;
            for (const m of this.pollenMotes) {
              m.x *= scaleX;
              m.y *= scaleY;
            }
            this.petalPool.rescalePositions(scaleX, scaleY);
            this.updateHoverState();
          }
        }

        /**
         * Initialize sunlit pollen motes & initial ambient single petals in Object Pool
         */
        initSummerAtmosphere() {
          this.pollenMotes = [];
          const moteCount = this.isLowEndDevice ? 24 : 42;
          for (let i = 0; i < moteCount; i++) {
            this.pollenMotes.push({
              x: Math.random() * this.width,
              y: Math.random() * this.height,
              scale: 0.35 + Math.random() * 0.55,
              vx: 6 + Math.random() * 14,
              vy: -4 + Math.random() * 10,
              phase: Math.random() * Math.PI * 2,
              isGold: Math.random() > 0.38,
            });
          }

          this.petalPool.clearAll();
          const initialAmbient = Math.min(
            this.maxActivePetals,
            this.isLowEndDevice ? 14 : 22,
          );
          for (let i = 0; i < initialAmbient; i++) {
            const p = this.petalPool.acquire();
            if (p) {
              this.configureSingleFallenPetal(p, true, true);
            }
          }
        }

        /**
         * Configure/recycle a pooled single sakura petal in-place (zero allocations)
         */
        configureSingleFallenPetal(
          p,
          persistent = true,
          randomScreenPos = false,
          originX = null,
          originY = null,
          burst = false,
        ) {
          p.active = true;
          p.persistent = persistent;

          if (originX !== null && originY !== null) {
            p.x = originX + (Math.random() - 0.5) * 14;
            p.y = originY + (Math.random() - 0.5) * 14;
            const ang = Math.random() * Math.PI * 2;
            const speed = burst
              ? 18 + Math.random() * 48
              : 12 + Math.random() * 24;
            p.vx = Math.cos(ang) * speed + 22 + Math.random() * 26;
            p.vy = Math.sin(ang) * speed * 0.65 + 10 + Math.random() * 18;
          } else if (randomScreenPos) {
            p.x = Math.random() * this.width;
            p.y = Math.random() * this.height;
            p.vx = 16 + Math.random() * 22;
            p.vy = 9 + Math.random() * 15;
          } else {
            // Re-enter gently from left or top edge on the warm summer breeze
            if (Math.random() < 0.52) {
              p.x = -24 - Math.random() * 80;
              p.y = Math.random() * this.height * 0.88;
            } else {
              p.x = Math.random() * this.width * 0.92;
              p.y = -24 - Math.random() * 60;
            }
            p.vx = 18 + Math.random() * 24;
            p.vy = 10 + Math.random() * 16;
          }

          p.size = 5.5 + Math.random() * 5.0;
          p.rot = Math.random() * Math.PI * 2;
          p.vRot = (Math.random() - 0.5) * 2.1;
          p.flipPhase = Math.random() * Math.PI * 2;
          p.flipSpeed = 1.5 + Math.random() * 2.0;
          p.swayPhase = Math.random() * Math.PI * 2;
          p.swayAmp = 12 + Math.random() * 18;
          p.alpha = 0.85 + Math.random() * 0.15;
          p.delay = burst ? Math.random() * 0.35 : 0;
          p.tone = Math.floor(Math.random() * 3);
        }

        spawnTransientBreezePetal(x, y) {
          const p = this.petalPool.acquire();
          if (!p) return;
          this.configureSingleFallenPetal(p, false, false, x, y, false);
          p.size = 4.5 + Math.random() * 3.5;
          p.alpha = 0.78;
        }

        /**
         * ==========================================================================
         * PROCEDURAL ZOOMED-IN SAKURA TREE WITH SHARP POINTED BRANCH TIPS ("RUNCING")
         * ==========================================================================
         */
        buildSakuraTree() {
          this.branches = [];
          this.decorativeBlossoms = [];
          const preservedPlucked = new Set(this.pluckedIds);

          const W = this.width;
          const H = this.height;
          const aspect = W / Math.max(1, H);
          const isMobile = W < 640;
          const isPortrait = aspect < 0.9;
          const isCompactHeight = H < 500;

          let seed = 7319;
          const rand = () => {
            seed = (seed * 16807) % 2147483647;
            return (seed - 1) / 2147483646;
          };

          const addBranch = (opts) => {
            const branch = {
              id: this.branches.length,
              parentId: opts.parentId ?? null,
              parentT: opts.parentT ?? 1,
              p0: opts.p0,
              p1: opts.p1,
              p2: opts.p2,
              p3: opts.p3,
              rStart: opts.rStart,
              rEnd: opts.rEnd,
              depth: opts.depth,
              growStart: opts.growStart,
              growEnd: opts.growEnd,
              swayFreq: 0.55 + rand() * 0.35,
              swayPhase: rand() * Math.PI * 2,
              swayAmp: 0.0045 + opts.depth * 0.0065,
            };
            this.branches.push(branch);
            return branch;
          };

          const trunkStartY = isPortrait ? 0.85 : isCompactHeight ? 0.92 : 0.87;
          const trunkEndX = isPortrait ? 0.23 : 0.22;
          const trunkEndY = isPortrait ? 0.47 : isCompactHeight ? 0.52 : 0.46;

          const mainTrunk = addBranch({
            p0: { x: -W * 0.06, y: H * trunkStartY },
            p1: { x: W * 0.05, y: H * (isPortrait ? 0.67 : 0.66) },
            p2: { x: W * 0.13, y: H * (isPortrait ? 0.54 : 0.53) },
            p3: { x: W * trunkEndX, y: H * trunkEndY },
            rStart: Math.max(36, Math.min(W, H) * 0.095),
            rEnd: Math.max(15, Math.min(W, H) * 0.04),
            depth: 0,
            growStart: 0.0,
            growEnd: 0.32,
          });

          const reachBoost = isPortrait ? 0.11 : 0;
          const topCeiling = isCompactHeight ? 0.22 : 0.18;
          const bottomFloor = isCompactHeight ? 0.82 : 0.74;

          const primarySpecs = [
            {
              parent: mainTrunk,
              t: 0.88,
              c1: { x: W * 0.33, y: H * 0.35 },
              c2: { x: W * 0.49, y: H * 0.26 },
              end: { x: W * (0.68 + reachBoost), y: H * 0.28 },
              rRatio: 0.78,
              gStart: 0.22,
              gEnd: 0.58,
            },
            {
              parent: mainTrunk,
              t: 0.96,
              c1: { x: W * 0.36, y: H * 0.47 },
              c2: { x: W * 0.53, y: H * 0.51 },
              end: { x: W * (0.76 + reachBoost * 0.8), y: H * 0.44 },
              rRatio: 0.84,
              gStart: 0.25,
              gEnd: 0.62,
            },
            {
              parent: mainTrunk,
              t: 0.72,
              c1: { x: W * 0.29, y: H * 0.56 },
              c2: { x: W * 0.45, y: H * 0.64 },
              end: { x: W * (0.64 + reachBoost), y: H * 0.62 },
              rRatio: 0.66,
              gStart: 0.2,
              gEnd: 0.55,
            },
            {
              parent: mainTrunk,
              t: 0.56,
              c1: { x: W * 0.19, y: H * 0.33 },
              c2: { x: W * 0.33, y: H * (topCeiling + 0.02) },
              end: { x: W * (0.5 + reachBoost), y: H * topCeiling },
              rRatio: 0.62,
              gStart: 0.16,
              gEnd: 0.5,
            },
            {
              parent: mainTrunk,
              t: 0.38,
              c1: { x: W * 0.18, y: H * 0.68 },
              c2: { x: W * 0.32, y: H * (bottomFloor + 0.02) },
              end: { x: W * (0.46 + reachBoost), y: H * bottomFloor },
              rRatio: 0.52,
              gStart: 0.14,
              gEnd: 0.48,
            },
          ];

          const primaryBranches = primarySpecs.map((cfg) => {
            const origin = this.evalCubic(cfg.parent, cfg.t);
            const baseR =
              (cfg.parent.rStart * (1 - cfg.t) + cfg.parent.rEnd * cfg.t) *
              cfg.rRatio;
            return addBranch({
              parentId: cfg.parent.id,
              parentT: cfg.t,
              p0: origin,
              p1: cfg.c1,
              p2: cfg.c2,
              p3: cfg.end,
              rStart: baseR,
              rEnd: 0,
              depth: 1,
              growStart: cfg.gStart,
              growEnd: cfg.gEnd,
            });
          });

          const spanScale = Math.sqrt(W * H);
          primaryBranches.forEach((pBranch, idx) => {
            const subCount = idx < 3 ? 4 : 3;
            for (let s = 0; s < subCount; s++) {
              const tAttach = 0.32 + (s / (subCount - 1 || 1)) * 0.64;
              const origin = this.evalCubic(pBranch, tAttach);
              const tangent = this.evalCubicTangent(pBranch, tAttach);
              const baseAngle = Math.atan2(tangent.y, tangent.x);

              const side = (s % 2 === 0 ? -1 : 1) * (idx % 2 === 0 ? 1 : -1);
              const spreadAngle = baseAngle + side * (0.34 + rand() * 0.34);
              const length = spanScale * (0.115 + rand() * 0.085);

              const endX = Math.min(
                W * 0.9,
                Math.max(W * 0.14, origin.x + Math.cos(spreadAngle) * length),
              );
              const endY = Math.min(
                H * 0.86,
                Math.max(H * 0.15, origin.y + Math.sin(spreadAngle) * length),
              );

              const rAt =
                pBranch.rStart *
                Math.pow(Math.max(0.08, 1 - tAttach), 0.78) *
                0.68;
              const gStart =
                pBranch.growStart +
                (pBranch.growEnd - pBranch.growStart) * tAttach * 0.82;
              const gEnd = Math.min(0.84, gStart + 0.22);

              const sec = addBranch({
                parentId: pBranch.id,
                parentT: tAttach,
                p0: origin,
                p1: {
                  x:
                    origin.x +
                    Math.cos(spreadAngle - side * 0.18) * length * 0.45,
                  y:
                    origin.y +
                    Math.sin(spreadAngle - side * 0.18) * length * 0.45,
                },
                p2: {
                  x:
                    origin.x +
                    Math.cos(spreadAngle + side * 0.12) * length * 0.78,
                  y:
                    origin.y +
                    Math.sin(spreadAngle + side * 0.12) * length * 0.78,
                },
                p3: { x: endX, y: endY },
                rStart: Math.max(2.8, rAt),
                rEnd: 0,
                depth: 2,
                growStart: gStart,
                growEnd: gEnd,
              });

              for (let tw = 0; tw < 2; tw++) {
                const twT = 0.46 + tw * 0.46;
                const twOrigin = this.evalCubic(sec, twT);
                const twTan = this.evalCubicTangent(sec, twT);
                const twBaseAng = Math.atan2(twTan.y, twTan.x);
                const twSide = tw === 0 ? -side : side;
                const twAng = twBaseAng + twSide * (0.34 + rand() * 0.34);
                const twLen = spanScale * (0.052 + rand() * 0.042);

                const twEnd = {
                  x: Math.min(
                    W * 0.91,
                    Math.max(W * 0.13, twOrigin.x + Math.cos(twAng) * twLen),
                  ),
                  y: Math.min(
                    H * 0.87,
                    Math.max(H * 0.14, twOrigin.y + Math.sin(twAng) * twLen),
                  ),
                };

                addBranch({
                  parentId: sec.id,
                  parentT: twT,
                  p0: twOrigin,
                  p1: {
                    x: twOrigin.x + Math.cos(twAng) * twLen * 0.5,
                    y: twOrigin.y + Math.sin(twAng) * twLen * 0.5,
                  },
                  p2: {
                    x:
                      twOrigin.x +
                      Math.cos(twAng + twSide * 0.15) * twLen * 0.8,
                    y:
                      twOrigin.y +
                      Math.sin(twAng + twSide * 0.15) * twLen * 0.8,
                  },
                  p3: twEnd,
                  rStart: 2.0,
                  rEnd: 0,
                  depth: 3,
                  growStart: Math.min(0.82, gStart + 0.1),
                  growEnd: Math.min(0.92, gEnd + 0.12),
                });
              }
            }
          });

          // Airy decorative blossoms linked to pre-baked sprite indices
          const twigBranches = this.branches.filter((b) => b.depth >= 2);
          twigBranches.forEach((b) => {
            const count = 2;
            for (let i = 0; i < count; i++) {
              const t = 0.38 + (i / count) * 0.56;
              const pos = this.evalCubic(b, t);
              const offsetAng = rand() * Math.PI * 2;
              const offsetDist = 3 + rand() * 10;

              this.decorativeBlossoms.push({
                branchId: b.id,
                t,
                dx: Math.cos(offsetAng) * offsetDist,
                dy: Math.sin(offsetAng) * offsetDist,
                radius: (isMobile ? 7.0 : 9.2) + rand() * 5.0,
                rotation: rand() * Math.PI * 2,
                bloomStart: b.growEnd - 0.04 + rand() * 0.05,
                paletteIndex: Math.floor(rand() * DECORATIVE_PALETTES.length),
                isBud: rand() < 0.16,
                plucked: false,
                x: pos.x,
                y: pos.y,
              });
            }
          });

          this.placeTenBlossoms(preservedPlucked);
        }

        placeTenBlossoms(preservedPlucked) {
          const W = this.width;
          const H = this.height;
          const isMobile = W < 640;
          const isTabletOrTouch = this.isTouchDevice || W <= 1024;
          const isCompactHeight = H < 500;

          const minY = isCompactHeight ? H * 0.24 : H * 0.18;
          const maxY = isCompactHeight ? H * 0.86 : H * 0.82;
          const minX = W * (isMobile ? 0.15 : 0.18);
          const maxX = W * 0.87;

          const candidates = [];
          this.branches.forEach((b) => {
            if (b.depth < 1) return;
            const samples =
              b.depth === 3
                ? [0.6, 0.92]
                : b.depth === 2
                  ? [0.52, 0.88]
                  : [0.7, 0.92];
            samples.forEach((t) => {
              const pt = this.evalCubic(b, t);
              if (
                pt.x >= minX &&
                pt.x <= maxX &&
                pt.y >= minY &&
                pt.y <= maxY
              ) {
                candidates.push({
                  branchId: b.id,
                  t,
                  x: pt.x,
                  y: pt.y,
                  bloomStart: Math.min(0.92, b.growEnd + 0.01),
                });
              }
            });
          });

          const chosen = [];
          let minDist = Math.sqrt(W * H) * (isMobile ? 0.115 : 0.125);

          candidates.sort((a, b) => a.x + a.y * 0.55 - (b.x + b.y * 0.55));

          for (let pass = 0; pass < 9 && chosen.length < 10; pass++) {
            for (let i = 0; i < candidates.length && chosen.length < 10; i++) {
              const c = candidates[i];
              if (chosen.includes(c)) continue;
              const tooClose = chosen.some(
                (item) => Math.hypot(item.x - c.x, item.y - c.y) < minDist,
              );
              if (!tooClose) {
                chosen.push(c);
              }
            }
            minDist *= 0.84;
          }

          chosen.sort((a, b) => a.x * 0.68 + a.y - (b.x * 0.68 + b.y));

          const baseR = isMobile
            ? Math.max(14.5, Math.min(W, H) * 0.039)
            : isTabletOrTouch
              ? 18.0
              : 18.5;
          const hitR = isMobile ? 33 : isTabletOrTouch ? 35 : 29;

          this.interactiveBlossoms = THINGS_I_LIKE.map((itemObj, idx) => {
            const spot = chosen[idx % chosen.length];
            const offAng = (idx * 1.9) % (Math.PI * 2);
            const offDist = 3.5 + (idx % 3) * 2.0;

            return {
              item: itemObj,
              indexNumber: idx + 1,
              branchId: spot.branchId,
              t: spot.t,
              dx: Math.cos(offAng) * offDist,
              dy: Math.sin(offAng) * offDist,
              baseRadius: baseR,
              hitRadius: hitR,
              rotation: (idx * 0.78) % (Math.PI * 2),
              bloomStart: Math.min(0.9, spot.bloomStart + (idx / 10) * 0.06),
              swayPhase: idx * 0.55,
              hoverAmount: 0,
              plucked: preservedPlucked.has(itemObj.id),
              regrowScale: preservedPlucked.has(itemObj.id) ? 0 : 1,
              x: spot.x,
              y: spot.y,
            };
          });
        }

        evalCubic(branch, t) {
          const mt = 1 - t;
          const mt2 = mt * mt;
          const t2 = t * t;
          return {
            x:
              mt2 * mt * branch.p0.x +
              3 * mt2 * t * branch.p1.x +
              3 * mt * t2 * branch.p2.x +
              t2 * t * branch.p3.x,
            y:
              mt2 * mt * branch.p0.y +
              3 * mt2 * t * branch.p1.y +
              3 * mt * t2 * branch.p2.y +
              t2 * t * branch.p3.y,
          };
        }

        evalCubicTangent(branch, t) {
          const mt = 1 - t;
          return {
            x:
              3 * mt * mt * (branch.p1.x - branch.p0.x) +
              6 * mt * t * (branch.p2.x - branch.p1.x) +
              3 * t * t * (branch.p3.x - branch.p2.x),
            y:
              3 * mt * mt * (branch.p1.y - branch.p0.y) +
              6 * mt * t * (branch.p2.y - branch.p1.y) +
              3 * t * t * (branch.p3.y - branch.p2.y),
          };
        }

        computeAnimatedBranches(timeSec) {
          const computed = new Array(this.branches.length);

          for (let i = 0; i < this.branches.length; i++) {
            const b = this.branches[i];

            const rawGrow =
              (this.growthProgress - b.growStart) /
              Math.max(0.001, b.growEnd - b.growStart);
            const clampedGrow = Math.max(0, Math.min(1, rawGrow));
            const easedGrow = 1 - Math.pow(1 - clampedGrow, 3);

            const gentleBreezeFactor = 1 + this.breezeWave * 0.85;
            const primarySway = Math.sin(timeSec * b.swayFreq + b.swayPhase);
            const secondarySway =
              Math.sin(timeSec * (b.swayFreq * 0.45) + b.swayPhase * 1.4) *
              0.45;
            const swayAngle =
              (primarySway + secondarySway) * b.swayAmp * gentleBreezeFactor;

            let p0 = { x: b.p0.x, y: b.p0.y };
            let parentAngle = 0;

            if (b.parentId !== null && computed[b.parentId]) {
              const parentComp = computed[b.parentId];
              p0 = this.evalCubic(parentComp, b.parentT);
              parentAngle = parentComp.totalAngle;
            }

            const totalAngle = parentAngle + swayAngle;
            const cos = Math.cos(totalAngle);
            const sin = Math.sin(totalAngle);
            const rotateRel = (pt) => {
              const rx = pt.x - b.p0.x;
              const ry = pt.y - b.p0.y;
              return {
                x: p0.x + rx * cos - ry * sin,
                y: p0.y + rx * sin + ry * cos,
              };
            };

            computed[i] = {
              ...b,
              p0,
              p1: rotateRel(b.p1),
              p2: rotateRel(b.p2),
              p3: rotateRel(b.p3),
              grow: easedGrow,
              totalAngle,
            };
          }

          return computed;
        }

        findClosestBlossom(px, py) {
          if (this.growthProgress < 0.72) return null;
          let closest = null;
          let closestDist = Infinity;

          for (const flower of this.interactiveBlossoms) {
            if (flower.plucked || flower.regrowScale < 0.65) continue;
            const dist = Math.hypot(px - flower.x, py - flower.y);
            if (dist <= flower.hitRadius && dist < closestDist) {
              closest = flower;
              closestDist = dist;
            }
          }
          return closest;
        }

        /**
         * 3. GPU-Composited Tooltip Positioning via translate3d (zero top/left reflow)
         */
        positionTooltip(flower) {
          const headerEl = document.getElementById("topHeader");
          const headerBottom = headerEl
            ? headerEl.getBoundingClientRect().bottom
            : 68;

          const r = flower.baseRadius || 16;
          const halfTipW = Math.max(
            82,
            (this.tooltipEl.offsetWidth || 164) * 0.5,
          );
          const safeX = Math.round(
            Math.min(
              this.width - halfTipW - 12,
              Math.max(halfTipW + 12, flower.x),
            ),
          );
          const safeY = Math.round(Math.max(headerBottom + 36, flower.y - r - 8));

          if (safeX !== this.lastTooltipX || safeY !== this.lastTooltipY) {
            this.lastTooltipX = safeX;
            this.lastTooltipY = safeY;
            this.tooltipEl.style.transform = `translate3d(${safeX}px, ${safeY}px, 0) translate3d(-50%, -100%, 0)`;
          }
        }

        updateHoverState() {
          if (
            this.growthProgress < 0.72 ||
            this.isModalOpen() ||
            this.state !== "BLOOMING" ||
            this.branchesBare ||
            this.driftingBlossom
          ) {
            this.hoveredBlossom = null;
            this.canvas.style.cursor = "default";
            this.tooltipEl.style.opacity = "0";
            return;
          }

          const closest = this.findClosestBlossom(
            this.pointer.x,
            this.pointer.y,
          );
          this.hoveredBlossom = closest;

          if (closest) {
            this.canvas.style.cursor = "pointer";
            document.getElementById("tooltipIndex").textContent =
              `#${String(closest.indexNumber).padStart(2, "0")}`;
            document.getElementById("tooltipLabel").textContent =
              "Touch to release petal";
            this.positionTooltip(closest);
            this.tooltipEl.style.opacity = "1";
          } else {
            this.canvas.style.cursor = "default";
            this.tooltipEl.style.opacity = "0";
          }
        }

        releaseBlossom(flower) {
          flower.plucked = true;
          this.pluckedIds.add(flower.item.id);
          this.releasedIds.add(flower.item.id);
          this.pointer.x = -9999;
          this.pointer.y = -9999;
          this.updateCounterUI();
          this.updateHoverState();

          this.sound.playWarmBreezeLift();
          this.breezeWave = 1.0;

          for (let i = 0; i < 6; i++) {
            this.breezeRibbons.push({
              x: flower.x - 140 - Math.random() * 180,
              y: flower.y + (Math.random() - 0.5) * this.height * 0.45,
              length: 120 + Math.random() * 160,
              speed: 150 + Math.random() * 110,
              amp: 10 + Math.random() * 14,
              freq: 0.012 + Math.random() * 0.008,
              phase: Math.random() * Math.PI * 2,
              alpha: 0.18 + Math.random() * 0.16,
              life: 0,
              maxLife: 2.3 + Math.random() * 0.7,
            });
          }

          const maxTargetRadius = Math.min(this.width, this.height) * 0.15;
          const targetScale = Math.max(
            2.4,
            Math.min(3.8, maxTargetRadius / Math.max(12, flower.baseRadius)),
          );

          this.driftingBlossom = {
            flower,
            startX: flower.x,
            startY: flower.y,
            x: flower.x,
            y: flower.y,
            scale: 1.0,
            targetScale,
            elapsed: 0,
            duration: 2.45,
            rotZ: flower.rotation,
            rotX: 0,
            rotY: 0,
            sCurveDir: flower.x > this.width * 0.52 ? -1 : 1,
            phase: Math.random() * Math.PI * 2,
          };
        }

        updateCounterUI() {
          const count = this.releasedIds.size;
          document.getElementById("counterLabel").textContent = `${count}/10`;
        }

        openQuoteModal(itemObj) {
          this.activeQuote = itemObj;
          document.getElementById("quoteBadge").textContent =
            `${String(itemObj.id).padStart(2, "0")} / 10`;
          document.getElementById("quoteText").textContent =
            `“${itemObj.text}”`;
          document.getElementById("quoteSource").textContent = itemObj.source;

          const modal = document.getElementById("quoteModal");
          const card = document.getElementById("quoteCard");
          modal.classList.remove("hidden");
          modal.classList.add("flex");

          card.classList.remove("animate-serene-reveal");
          void card.offsetWidth;
          card.classList.add("animate-serene-reveal");
        }

        closeQuoteModal() {
          const wasFinalNote =
            this.state === "BLOOMING" && this.releasedIds.size >= 10;
          const modal = document.getElementById("quoteModal");
          modal.classList.add("hidden");
          modal.classList.remove("flex");
          this.activeQuote = null;
          this.updateHoverState();

          if (wasFinalNote) {
            this.triggerFinalPetalScatter();
          }
        }

        /**
         * At 10/10: fill the Object Pool (bounded by maxActivePetals: 50 low-end / 110 high-end)
         * with persistent single fallen petals ("kelopak gugur putus")
         */
        triggerFinalPetalScatter() {
          this.state = "SCATTERED";
          this.branchesBare = true;
          this.breezeWave = 1.45;
          this.hoveredBlossom = null;
          this.canvas.style.cursor = "default";
          this.sound.playScatterWhisper();

          this.petalPool.clearAll();

          // Spawn burst petals from branch blossom positions up to 65% of pool capacity
          const burstBudget = Math.floor(this.maxActivePetals * 0.65);
          let spawned = 0;

          for (
            let i = 0;
            i < this.decorativeBlossoms.length && spawned < burstBudget;
            i++
          ) {
            const db = this.decorativeBlossoms[i];
            const perBlossom = db.isBud ? 1 : 2;
            for (let k = 0; k < perBlossom && spawned < burstBudget; k++) {
              const p = this.petalPool.acquire();
              if (!p) break;
              this.configureSingleFallenPetal(
                p,
                true,
                false,
                db.x,
                db.y,
                true,
              );
              spawned++;
            }
          }

          // Fill the remaining pool capacity with continuous ambient single fallen petals
          while (spawned < this.maxActivePetals) {
            const p = this.petalPool.acquire();
            if (!p) break;
            this.configureSingleFallenPetal(p, true, true);
            spawned++;
          }

          for (let i = 0; i < 10; i++) {
            this.breezeRibbons.push({
              x: -100 - Math.random() * 200,
              y: this.height * (0.18 + Math.random() * 0.64),
              length: 140 + Math.random() * 180,
              speed: 170 + Math.random() * 120,
              amp: 12 + Math.random() * 14,
              freq: 0.012 + Math.random() * 0.008,
              phase: Math.random() * Math.PI * 2,
              alpha: 0.22 + Math.random() * 0.16,
              life: 0,
              maxLife: 2.6 + Math.random() * 0.8,
            });
          }
        }

        /**
         * Frame update loop (60 FPS)
         */
        update(dt, now) {
          if (this.growthProgress < 1) {
            this.growthProgress = Math.min(
              1,
              (now - this.growthStartTime) / this.growthDuration,
            );
          }

          if (this.breezeWave > 0) {
            this.breezeWave = Math.max(0, this.breezeWave - dt * 0.34);
          }

          for (const f of this.interactiveBlossoms) {
            const targetHover = this.hoveredBlossom === f ? 1 : 0;
            f.hoverAmount +=
              (targetHover - f.hoverAmount) * Math.min(1, dt * 9);
          }

          for (const m of this.pollenMotes) {
            m.phase += dt * 1.1;
            m.x += (m.vx + Math.sin(m.phase) * 6) * dt;
            m.y += (m.vy + Math.cos(m.phase * 0.8) * 5) * dt;

            if (m.x > this.width + 20) m.x = -20;
            if (m.x < -20) m.x = this.width + 20;
            if (m.y > this.height + 20) m.y = -20;
            if (m.y < -20) m.y = this.height + 20;
          }

          // Update all active petals in the Object Pool and recycle in-place at viewport edges
          const breezeMult =
            this.state === "SCATTERED" ? 1.15 : 1 + this.breezeWave * 1.35;
          const poolItems = this.petalPool.items;
          const poolCap = this.petalPool.capacity;

          for (let i = 0; i < poolCap; i++) {
            const p = poolItems[i];
            if (!p.active) continue;

            if (p.delay > 0) {
              p.delay -= dt;
              continue;
            }

            p.swayPhase += dt * 1.65;
            p.flipPhase += dt * p.flipSpeed;

            if (this.state === "SCATTERED") {
              p.vx += (22 - p.vx) * Math.min(1, dt * 0.85);
              p.vy += (14 - p.vy) * Math.min(1, dt * 0.85);
            }

            p.x +=
              (p.vx * breezeMult + Math.sin(p.swayPhase) * p.swayAmp * 0.65) *
              dt;
            p.y += (p.vy + Math.cos(p.swayPhase * 0.8) * 8.5) * dt;
            p.rot += p.vRot * dt;

            // Recycle or release immediately when exiting viewport
            if (
              p.x > this.width + 36 ||
              p.y > this.height + 36 ||
              p.x < -140
            ) {
              if (p.persistent) {
                this.configureSingleFallenPetal(p, true, false);
              } else {
                this.petalPool.release(p);
              }
            }
          }

          // Warm air breeze ribbons
          for (let i = this.breezeRibbons.length - 1; i >= 0; i--) {
            const r = this.breezeRibbons[i];
            r.life += dt;
            r.x += r.speed * dt;
            r.y -= 14 * dt;
            if (r.life >= r.maxLife) {
              this.breezeRibbons.splice(i, 1);
            }
          }

          // Smooth warm-summer-breeze petal drift toward the viewer
          if (this.driftingBlossom) {
            const db = this.driftingBlossom;
            db.elapsed += dt;
            const t = Math.min(1, db.elapsed / db.duration);

            const ease = 0.5 - 0.5 * Math.cos(t * Math.PI);
            const liftArc =
              Math.sin(t * Math.PI) * Math.min(52, this.height * 0.08);
            const sCurve =
              Math.sin(t * Math.PI * 1.5 + db.phase) *
              Math.min(34, this.width * 0.05) *
              db.sCurveDir;

            const targetX = this.width * 0.5;
            const targetY = this.height * 0.5;

            db.x = db.startX + (targetX - db.startX) * ease + sCurve;
            db.y = db.startY + (targetY - db.startY) * ease - liftArc;
            db.scale = 1.0 + ease * (db.targetScale - 1.0);

            db.rotZ +=
              (0.85 + Math.sin(t * Math.PI) * 0.65) * db.sCurveDir * dt;
            db.rotX = Math.sin(t * Math.PI * 1.4) * 0.42;
            db.rotY = Math.cos(t * Math.PI * 1.2) * 0.38;

            if (t >= 1) {
              const releasedItem = db.flower.item;
              this.driftingBlossom = null;
              this.openQuoteModal(releasedItem);
            }
          }
        }

        /**
         * Blit pre-rendered background canvas & draw cached pollen motes
         */
        drawBackground() {
          const ctx = this.ctx;
          ctx.drawImage(this.bgCanvas, 0, 0, this.width, this.height);

          const goldSprite = this.sprites.pollenSprites.gold;
          const blushSprite = this.sprites.pollenSprites.blush;

          for (let i = 0; i < this.pollenMotes.length; i++) {
            const m = this.pollenMotes[i];
            const pulse = 0.45 + 0.55 * Math.sin(m.phase * 1.4);
            const drawSize = 14 * m.scale;
            const half = drawSize * 0.5;
            ctx.globalAlpha = pulse;
            ctx.drawImage(
              m.isGold ? goldSprite : blushSprite,
              m.x - half,
              m.y - half,
              drawSize,
              drawSize,
            );
          }
          ctx.globalAlpha = 1;
        }

        /**
         * Draw tapered organic sakura trunk, boughs & twigs with pointed tips ("runcing")
         * Uses zero per-frame shadowBlur for smooth 60 FPS mobile performance.
         */
        drawBranches(computedBranches) {
          const ctx = this.ctx;

          for (let i = 0; i < computedBranches.length; i++) {
            const b = computedBranches[i];
            if (b.grow <= 0.002) continue;

            const steps = b.depth === 0 ? 28 : b.depth === 1 ? 22 : 14;
            const leftPts = [];
            const rightPts = [];
            let tipApex = null;

            for (let s = 0; s <= steps; s++) {
              const frac = s / steps;
              const t = frac * b.grow;
              const pt = this.evalCubic(b, t);
              const tan = this.evalCubicTangent(b, t);
              const len = Math.hypot(tan.x, tan.y) || 1;
              const tx = tan.x / len;
              const ty = tan.y / len;
              const nx = -ty;
              const ny = tx;

              let radius;
              if (b.depth === 0) {
                const growthTip =
                  b.grow < 1 ? Math.cos(frac * Math.PI * 0.5) : 1;
                radius =
                  (b.rStart + (b.rEnd - b.rStart) * t) *
                  (0.35 + 0.65 * growthTip);
              } else {
                const lengthTaper = Math.pow(Math.max(0, 1 - t), 0.78);
                const tipPoint = Math.pow(Math.max(0, 1 - frac), 0.62);
                radius = b.rStart * lengthTaper * tipPoint;
              }

              if (s === steps && b.depth >= 1) {
                const needleExtend = Math.min(7.5, b.rStart * 0.34) * b.grow;
                tipApex = {
                  x: pt.x + tx * needleExtend,
                  y: pt.y + ty * needleExtend,
                };
              } else {
                leftPts.push({ x: pt.x + nx * radius, y: pt.y + ny * radius });
                rightPts.push({ x: pt.x - nx * radius, y: pt.y - ny * radius });
              }
            }

            // Build branch silhouette path once
            ctx.beginPath();
            ctx.moveTo(leftPts[0].x, leftPts[0].y);
            for (let s = 1; s < leftPts.length; s++) {
              ctx.lineTo(leftPts[s].x, leftPts[s].y);
            }
            if (tipApex) {
              ctx.lineTo(tipApex.x, tipApex.y);
            }
            for (let s = rightPts.length - 1; s >= 0; s--) {
              ctx.lineTo(rightPts[s].x, rightPts[s].y);
            }
            ctx.closePath();

            // Lightweight soft depth shadow on primary boughs without GPU shadowBlur
            if (b.depth <= 1) {
              ctx.save();
              ctx.translate(3, 7);
              ctx.fillStyle = "rgba(60, 45, 50, 0.055)";
              ctx.fill();
              ctx.restore();
            }

            const barkGrad = ctx.createLinearGradient(
              b.p0.x,
              b.p0.y,
              b.p3.x,
              b.p3.y,
            );
            barkGrad.addColorStop(0, "#3F3134");
            barkGrad.addColorStop(0.55, "#59474A");
            barkGrad.addColorStop(1, "#735D61");
            ctx.fillStyle = barkGrad;
            ctx.fill();

            // Subtle warm sunlit rim highlight along upper contour of main boughs
            if (b.depth <= 1 && rightPts.length > 2) {
              ctx.beginPath();
              ctx.moveTo(rightPts[0].x, rightPts[0].y);
              for (let s = 1; s < rightPts.length; s++) {
                ctx.lineTo(rightPts[s].x, rightPts[s].y);
              }
              if (tipApex) {
                ctx.lineTo(tipApex.x, tipApex.y);
              }
              ctx.strokeStyle = "rgba(250, 218, 221, 0.28)";
              ctx.lineWidth = b.depth === 0 ? 1.8 : 1.1;
              ctx.lineCap = "round";
              ctx.stroke();
            }
          }
        }

        /**
         * Helper to stamp a pre-rendered Offscreen Canvas sprite cleanly
         */
        drawCachedSprite(
          spriteObj,
          x,
          y,
          radius,
          rotation,
          scaleX = 1,
          scaleY = 1,
          alpha = 1,
        ) {
          const ctx = this.ctx;
          const drawSize = radius * spriteObj.ratio;
          const half = drawSize * 0.5;

          ctx.save();
          ctx.translate(x, y);
          if (rotation !== 0) ctx.rotate(rotation);
          if (scaleX !== 1 || scaleY !== 1) ctx.scale(scaleX, scaleY);
          if (alpha !== 1) ctx.globalAlpha = alpha;
          ctx.drawImage(spriteObj.canvas, -half, -half, drawSize, drawSize);
          ctx.restore();
        }

        /**
         * Draw decorative blossoms & 10 interactive blossoms using Offscreen Sprite Cache
         */
        drawTreeBlossoms(computedBranches, timeSec) {
          if (this.branchesBare) return;

          const ctx = this.ctx;

          // 1. Airy decorative blossoms (blitted from offscreen sprites)
          for (let i = 0; i < this.decorativeBlossoms.length; i++) {
            const db = this.decorativeBlossoms[i];
            if (db.plucked) continue;
            const rawBloom = (this.growthProgress - db.bloomStart) / 0.18;
            if (rawBloom <= 0) continue;
            const t = Math.min(1, rawBloom);
            const easeBloom = 1 - Math.pow(1 - t, 3);

            const branch = computedBranches[db.branchId];
            const anchor = this.evalCubic(branch, db.t);
            const flutter = Math.sin(timeSec * 1.2 + db.rotation) * 0.06;

            db.x = anchor.x + db.dx;
            db.y = anchor.y + db.dy;

            const sprite = db.isBud
              ? this.sprites.budSprite
              : this.sprites.decorativeBlossoms[db.paletteIndex];

            this.drawCachedSprite(
              sprite,
              db.x,
              db.y,
              db.radius * easeBloom,
              db.rotation + flutter,
              1,
              1,
              0.94,
            );
          }

          // 2. The 10 Interactive Blossoms
          for (let i = 0; i < this.interactiveBlossoms.length; i++) {
            const ib = this.interactiveBlossoms[i];
            const branch = computedBranches[ib.branchId];
            const anchor = this.evalCubic(branch, ib.t);
            ib.x = anchor.x + ib.dx;
            ib.y = anchor.y + ib.dy;

            const rawBloom = (this.growthProgress - ib.bloomStart) / 0.2;
            if (rawBloom <= 0) continue;

            // Subtle tiny stem node left behind once a blossom has detached
            if (ib.plucked) {
              ctx.fillStyle = "#735D61";
              ctx.beginPath();
              ctx.arc(ib.x, ib.y, 2.1, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "#FADADD";
              ctx.beginPath();
              ctx.arc(ib.x, ib.y, 1.0, 0, Math.PI * 2);
              ctx.fill();
              continue;
            }

            const bloomT = Math.min(1, rawBloom);
            const easeBloom = 1 - Math.pow(1 - bloomT, 3);
            const gentleBreathe =
              0.5 + 0.5 * Math.sin(timeSec * 1.8 + ib.swayPhase);
            const hoverBoost = ib.hoverAmount;

            const radius =
              ib.baseRadius *
              easeBloom *
              ib.regrowScale *
              (1 + gentleBreathe * 0.04 + hoverBoost * 0.22);

            const flutter =
              ib.rotation +
              Math.sin(timeSec * (1.3 + hoverBoost * 3.0) + ib.swayPhase) *
                (0.05 + hoverBoost * 0.09);

            // Delicate frosted-blush ring indicating interactivity
            if (bloomT >= 0.88 && ib.regrowScale >= 0.95) {
              ctx.beginPath();
              ctx.arc(
                ib.x,
                ib.y,
                radius * (1.28 + gentleBreathe * 0.18 + hoverBoost * 0.22),
                0,
                Math.PI * 2,
              );
              ctx.strokeStyle = `rgba(230, 126, 150, ${0.18 + gentleBreathe * 0.14 + hoverBoost * 0.36})`;
              ctx.lineWidth = 0.9 + hoverBoost * 0.7;
              ctx.stroke();
            }

            const sprite =
              hoverBoost > 0.35
                ? this.sprites.interactiveBlossomHover
                : this.sprites.interactiveBlossom;

            this.drawCachedSprite(sprite, ib.x, ib.y, radius, flutter, 1, 1, 1);
          }
        }

        /**
         * Draw pooled single petals, breeze ribbons, and active detached blossom
         */
        drawSummerBreezeAndFlight(timeSec) {
          const ctx = this.ctx;

          // 1. Render all active single sakura petals from the Object Pool via drawImage()
          const poolItems = this.petalPool.items;
          const poolCap = this.petalPool.capacity;
          for (let i = 0; i < poolCap; i++) {
            const p = poolItems[i];
            if (!p.active || p.delay > 0) continue;

            const flipScale = 0.42 + 0.58 * Math.abs(Math.cos(p.flipPhase));
            const sprite = this.sprites.singlePetals[p.tone];
            this.drawCachedSprite(
              sprite,
              p.x,
              p.y,
              p.size,
              p.rot,
              1,
              flipScale,
              p.alpha,
            );
          }

          // 2. Delicate warm summer breeze ribbons
          for (let i = 0; i < this.breezeRibbons.length; i++) {
            const r = this.breezeRibbons[i];
            const progress = r.life / r.maxLife;
            const fade = Math.sin(progress * Math.PI);
            ctx.beginPath();
            const segments = 16;
            for (let s = 0; s <= segments; s++) {
              const st = s / segments;
              const px = r.x + st * r.length;
              const py =
                r.y + Math.sin(px * r.freq + r.phase + timeSec * 2.5) * r.amp;
              if (s === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.strokeStyle = `rgba(244, 167, 185, ${r.alpha * fade})`;
            ctx.lineWidth = 1.25;
            ctx.lineCap = "round";
            ctx.stroke();
          }

          // 3. Detached blossom gliding gracefully toward the viewer (using high-res sprite)
          if (this.driftingBlossom) {
            const db = this.driftingBlossom;
            const t = Math.min(1, db.elapsed / db.duration);
            const radius = db.flower.baseRadius * db.scale;

            const foreshortenX = Math.max(0.55, Math.cos(db.rotY));
            const foreshortenY = Math.max(0.55, Math.cos(db.rotX));
            const foregroundAlpha = t > 0.84 ? 1 - (t - 0.84) / 0.16 : 1;

            this.drawCachedSprite(
              this.sprites.interactiveBlossomHover,
              db.x,
              db.y,
              radius,
              db.rotZ,
              foreshortenX,
              foreshortenY,
              Math.max(0, foregroundAlpha),
            );
          }
        }

        frame(now) {
          const dt = Math.min(0.05, (now - this.lastTimestamp) / 1000);
          this.lastTimestamp = now;
          const timeSec = now / 1000;

          this.update(dt, now);

          const computedBranches = this.computeAnimatedBranches(timeSec);

          this.drawBackground();
          this.drawBranches(computedBranches);
          this.drawTreeBlossoms(computedBranches, timeSec);
          this.drawSummerBreezeAndFlight(timeSec);

          if (
            this.hoveredBlossom &&
            !this.driftingBlossom &&
            !this.isModalOpen()
          ) {
            this.positionTooltip(this.hoveredBlossom);
          }

          requestAnimationFrame((nextNow) => this.frame(nextNow));
        }

        start() {
          requestAnimationFrame((now) => {
            this.lastTimestamp = now;
            this.growthStartTime = now;
            this.frame(now);
          });
        }
      }

      window.onload = function () {
        const app = new SakuraExperience();
        app.start();
      };
    </script>
  </body>
