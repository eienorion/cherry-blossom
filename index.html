<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>10 things i like about you</title>

    <!-- Google Fonts: Cormorant Garamond for poetic lines & Plus Jakarta Sans for clean UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Cormorant Garamond"', "Georgia", "serif"],
              sans: ['"Plus Jakarta Sans"', "system-ui", "sans-serif"],
            },
            colors: {
              alabaster: "#FCFBF9",
              pearl: "#ECE6E4",
              charcoal: {
                DEFAULT: "#231F20",
                muted: "#6E6568",
              },
              bark: {
                dark: "#4A3B3E",
                light: "#735D61",
              },
              sakura: {
                blush: "#FADADD",
                petal: "#F4A7B9",
                deep: "#E67E96",
              },
            },
          },
        },
      };
    </script>

    <style>
      /* Full-screen luminous white canvas without scrollbars */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #ffffff;
        color: #231f20;
        font-family: "Plus Jakarta Sans", sans-serif;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #sakuraCanvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: manipulation;
      }

      /* Frosted white secondary surfaces with warm pearl borders & diffused shadows */
      .frosted-card {
        background: rgba(255, 255, 255, 0.93);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(218, 165, 180, 0.35);
        box-shadow:
          0 24px 60px -12px rgba(60, 45, 50, 0.1),
          0 8px 24px -6px rgba(60, 45, 50, 0.06),
          inset 0 1px 0 rgba(255, 255, 255, 1);
      }

      .frosted-pill {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(218, 165, 180, 0.35);
        box-shadow:
          0 8px 24px -4px rgba(60, 45, 50, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 1);
        transition: all 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* Serene entrance animation for the note card */
      @keyframes sereneCardFade {
        0% {
          opacity: 0;
          transform: translateY(18px) scale(0.97);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .animate-serene-reveal {
        animation: sereneCardFade 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-sakura-blush selection:text-charcoal">
    <!-- Main Interactive Daylight Canvas -->
    <canvas id="sakuraCanvas"></canvas>

    <!-- Clean Minimalist Top-Center Parameter Header -->
    <header
      class="fixed top-5 sm:top-7 left-1/2 -translate-x-1/2 z-20 pointer-events-none px-4 w-full flex justify-center"
    >
      <div
        class="frosted-pill rounded-full px-5 py-2.5 sm:px-7 sm:py-3 inline-flex items-center gap-3 sm:gap-4"
      >
        <span class="w-2 h-2 rounded-full bg-sakura-deep shrink-0"></span>
        <h1
          class="font-serif italic text-lg sm:text-xl text-charcoal leading-none font-medium tracking-wide whitespace-nowrap"
        >
          10 things i like about you
        </h1>
        <span class="w-px h-4 bg-pearl shrink-0"></span>
        <span
          id="counterLabel"
          class="font-sans text-xs sm:text-sm font-medium tracking-[0.16em] text-sakura-deep whitespace-nowrap"
        >
          0/10
        </span>
      </div>
    </header>

    <!-- Floating Frosted-White Hover Tooltip (Preserved from Reference) -->
    <div
      id="hoverTooltip"
      class="fixed z-20 pointer-events-none opacity-0 transition-opacity duration-200 -translate-x-1/2 -translate-y-full pb-3"
    >
      <div
        class="frosted-pill rounded-full px-3.5 py-1.5 flex items-center gap-2 whitespace-nowrap"
      >
        <span
          id="tooltipIndex"
          class="text-[11px] font-semibold text-sakura-deep"
          >#01</span
        >
        <span class="w-1 h-1 rounded-full bg-pearl"></span>
        <span id="tooltipLabel" class="text-xs text-charcoal font-normal"
          >Touch to release petal</span
        >
      </div>
    </div>

    <!-- Serene Frosted-White Note Modal -->
    <div
      id="quoteModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="quoteText"
      class="fixed inset-0 z-40 hidden items-center justify-center p-4 sm:p-6 bg-white/45 backdrop-blur-xs transition-opacity duration-500"
    >
      <div
        id="quoteCard"
        class="frosted-card relative w-full max-w-xl rounded-3xl p-8 sm:p-11 md:p-12 text-center overflow-hidden"
      >
        <!-- Subtle Warm Blush & White Ambient Glow Inside Card -->
        <div
          class="pointer-events-none absolute -top-24 -right-24 w-56 h-56 rounded-full bg-sakura-blush/45 blur-3xl"
        ></div>
        <div
          class="pointer-events-none absolute -bottom-24 -left-24 w-56 h-56 rounded-full bg-alabaster blur-3xl"
        ></div>

        <!-- Close Button -->
        <button
          id="closeQuoteBtn"
          type="button"
          aria-label="Close note"
          class="absolute top-4 right-4 sm:top-5 sm:right-5 w-10 h-10 rounded-full flex items-center justify-center text-charcoal-muted hover:text-charcoal hover:bg-alabaster transition cursor-pointer"
        >
          <svg
            class="w-5 h-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <!-- Frosted White Petal Badge -->
        <div
          class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-white border border-pearl text-charcoal-muted text-xs tracking-[0.2em] uppercase mb-6 shadow-2xs"
        >
          <span class="w-1.5 h-1.5 rounded-full bg-sakura-deep"></span>
          <span id="quoteBadge">01 / 10</span>
        </div>

        <!-- Note Text -->
        <blockquote class="relative my-2">
          <p
            id="quoteText"
            class="font-serif italic text-2xl sm:text-3xl md:text-[32px] text-charcoal leading-[1.45] font-normal"
          >
            “Her eyes, especially the way they sparkle.”
          </p>
        </blockquote>

        <!-- Minimalist Divider -->
        <div
          class="w-16 h-px bg-gradient-to-r from-transparent via-sakura-petal to-transparent mx-auto my-6"
        ></div>

        <!-- Title & Reason Attribution -->
        <div class="space-y-1 mb-7">
          <p
            class="text-xs sm:text-sm font-semibold tracking-[0.2em] uppercase text-charcoal"
          >
            10 things i like about you
          </p>
          <p
            id="quoteSource"
            class="text-sm sm:text-base text-charcoal-muted italic font-serif"
          >
            Reason #01 of 10
          </p>
        </div>

        <!-- Single Dismiss Action -->
        <div class="flex items-center justify-center">
          <button
            id="continueTreeBtn"
            type="button"
            class="rounded-full px-7 py-2.5 text-xs sm:text-sm font-medium bg-charcoal text-white hover:bg-bark-dark transition shadow-md shadow-charcoal/10 cursor-pointer"
          >
            Lanjutkan
          </button>
        </div>
      </div>
    </div>

    <script>
      /**

      /**
       * ============================================================================
       * PROCEDURAL SUMMER BREEZE & HARMONIC CHIME ENGINE (WEB AUDIO API)
       * Unlocks gently on first touch/click without requiring extra UI buttons.
       * ============================================================================
       */
      class SummerBreezeAudio {
        constructor() {
          this.ctx = null;
          this.windGain = null;
          this.windFilter = null;
        }

        unlock() {
          try {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (!AudioCtx) return;
              this.ctx = new AudioCtx();

              const bufferSize = 2 * this.ctx.sampleRate;
              const noiseBuffer = this.ctx.createBuffer(
                1,
                bufferSize,
                this.ctx.sampleRate,
              );
              const output = noiseBuffer.getChannelData(0);
              let b0 = 0,
                b1 = 0,
                b2 = 0;
              for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                b0 = 0.99765 * b0 + white * 0.099046;
                b1 = 0.963 * b1 + white * 0.2965164;
                b2 = 0.57 * b2 + white * 1.0526913;
                output[i] = (b0 + b1 + b2 + white * 0.1848) * 0.16;
              }

              const noiseSource = this.ctx.createBufferSource();
              noiseSource.buffer = noiseBuffer;
              noiseSource.loop = true;

              this.windFilter = this.ctx.createBiquadFilter();
              this.windFilter.type = "bandpass";
              this.windFilter.frequency.value = 310;
              this.windFilter.Q.value = 1.4;

              this.windGain = this.ctx.createGain();
              this.windGain.gain.value = 0.0001;

              noiseSource.connect(this.windFilter);
              this.windFilter.connect(this.windGain);
              this.windGain.connect(this.ctx.destination);
              noiseSource.start(0);
            }

            if (this.ctx.state === "suspended") {
              this.ctx.resume();
            }
          } catch (err) {
            // Ignore audio restrictions silently
          }
        }

        playWarmBreezeLift() {
          this.unlock();
          if (!this.ctx || !this.windFilter || !this.windGain) return;
          try {
            const now = this.ctx.currentTime;
            this.windFilter.frequency.cancelScheduledValues(now);
            this.windFilter.frequency.setValueAtTime(300, now);
            this.windFilter.frequency.exponentialRampToValueAtTime(
              560,
              now + 1.1,
            );
            this.windFilter.frequency.exponentialRampToValueAtTime(
              310,
              now + 2.8,
            );

            this.windGain.gain.cancelScheduledValues(now);
            this.windGain.gain.setValueAtTime(0.012, now);
            this.windGain.gain.linearRampToValueAtTime(0.055, now + 0.9);
            this.windGain.gain.exponentialRampToValueAtTime(0.012, now + 2.9);

            const notes = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
            const freq = notes[Math.floor(Math.random() * notes.length)];
            this.playGentleChime(freq, 0.055);
          } catch (err) {
            // Ignore
          }
        }

        playGentleChime(freq, volume = 0.055) {
          this.unlock();
          if (!this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.003, now + 2.2);

            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(volume, now + 0.08);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 2.6);
          } catch (err) {
            // Ignore
          }
        }

        playScatterWhisper() {
          this.unlock();
          if (!this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            if (this.windFilter && this.windGain) {
              this.windFilter.frequency.cancelScheduledValues(now);
              this.windFilter.frequency.setValueAtTime(280, now);
              this.windFilter.frequency.exponentialRampToValueAtTime(
                640,
                now + 1.4,
              );
              this.windFilter.frequency.exponentialRampToValueAtTime(
                310,
                now + 3.4,
              );

              this.windGain.gain.cancelScheduledValues(now);
              this.windGain.gain.setValueAtTime(0.015, now);
              this.windGain.gain.linearRampToValueAtTime(0.075, now + 1.1);
              this.windGain.gain.exponentialRampToValueAtTime(0.015, now + 3.5);
            }

            [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
              setTimeout(() => this.playGentleChime(f, 0.045), idx * 140);
            });
          } catch (err) {
            // Ignore
          }
        }
      }

      /**
       * ============================================================================
       * MAIN INTERACTIVE SAKURA EXPERIENCE
       * - Exact zoomed-in sakura tree from reference with sharp pointed branch tips
       * - 10 interactive blossoms for "10 things i like about you"
       * - Preserved hover glow, flutter, and floating tooltip
       * - At 10/10: all remaining blossoms break apart into single detached petals
       *   ("kelopak gugur putus") that persist and drift endlessly across the screen
       * ============================================================================
       */
      class SakuraExperience {
        constructor() {
          this.canvas = document.getElementById("sakuraCanvas");
          this.ctx = this.canvas.getContext("2d");
          this.sound = new SummerBreezeAudio();

          this.width = window.innerWidth;
          this.height = window.innerHeight;
          this.dpr = Math.min(window.devicePixelRatio || 1, 2);

          // States: 'BLOOMING' -> 'SCATTERED'
          this.state = "BLOOMING";
          this.branchesBare = false;

          // Procedural tree growth timeline (~2.6 seconds)
          this.growthStartTime = performance.now();
          this.growthDuration = 2600;
          this.growthProgress = 0;

          // Tree geometry & blossoms
          this.branches = [];
          this.decorativeBlossoms = [];
          this.interactiveBlossoms = [];

          // State tracking for the 10 blossoms
          this.releasedIds = new Set();
          this.pluckedIds = new Set();

          // Active detached blossom gliding gently toward the viewer
          this.driftingBlossom = null;

          // Persistent single fallen petals ("kelopak gugur putus") after 10/10
          this.scatteredPetals = [];

          this.breezeWave = 0;
          this.breezeRibbons = [];

          // Sunlit summer pollen motes & ambient drifting single petals
          this.pollenMotes = [];
          this.ambientPetals = [];

          // Pointer & UI state
          this.pointer = { x: -9999, y: -9999 };
          this.hoveredBlossom = null;
          this.activeQuote = null;
          this.lastTimestamp = performance.now();

          this.bindEvents();
          this.handleResize(true);
          this.initSummerAtmosphere();
        }

        bindEvents() {
          window.addEventListener("resize", () => this.handleResize(false));

          this.canvas.addEventListener("pointermove", (e) => {
            this.pointer.x = e.clientX;
            this.pointer.y = e.clientY;
            this.updateHoverState();
          });

          this.canvas.addEventListener("pointerleave", () => {
            this.pointer.x = -9999;
            this.pointer.y = -9999;
            this.updateHoverState();
          });

          this.canvas.addEventListener("click", (e) => {
            this.sound.unlock();
            this.pointer.x = e.clientX;
            this.pointer.y = e.clientY;
            this.updateHoverState();

            if (this.isModalOpen()) return;

            if (
              this.state === "BLOOMING" &&
              this.hoveredBlossom &&
              !this.driftingBlossom
            ) {
              this.releaseBlossom(this.hoveredBlossom);
            }
          });

          // Note modal controls
          document
            .getElementById("closeQuoteBtn")
            .addEventListener("click", () => this.closeQuoteModal());
          document
            .getElementById("continueTreeBtn")
            .addEventListener("click", () => this.closeQuoteModal());
          document
            .getElementById("quoteModal")
            .addEventListener("click", (e) => {
              if (e.target.id === "quoteModal") {
                this.closeQuoteModal();
              }
            });

          window.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && this.isModalOpen()) {
              this.closeQuoteModal();
            }
          });
        }

        isModalOpen() {
          return !document
            .getElementById("quoteModal")
            .classList.contains("hidden");
        }

        handleResize(isInitial = false) {
          this.width = window.innerWidth;
          this.height = window.innerHeight;
          this.dpr = Math.min(window.devicePixelRatio || 1, 2);

          this.canvas.width = Math.floor(this.width * this.dpr);
          this.canvas.height = Math.floor(this.height * this.dpr);
          this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

          this.buildSakuraTree();
          if (!isInitial) {
            this.updateHoverState();
          }
        }

        /**
         * Initialize floating sunlit white/gold pollen motes & soft single sakura petals
         */
        initSummerAtmosphere() {
          this.pollenMotes = [];
          const moteCount = this.width < 640 ? 28 : 48;
          for (let i = 0; i < moteCount; i++) {
            this.pollenMotes.push({
              x: Math.random() * this.width,
              y: Math.random() * this.height,
              r: 1.4 + Math.random() * 2.6,
              vx: 6 + Math.random() * 14,
              vy: -4 + Math.random() * 10,
              phase: Math.random() * Math.PI * 2,
              isGold: Math.random() > 0.38,
            });
          }

          this.ambientPetals = [];
          const petalCount = this.width < 640 ? 14 : 22;
          for (let i = 0; i < petalCount; i++) {
            this.ambientPetals.push(this.createSingleFallenPetal(true));
          }
        }

        /**
         * Factory for an individual detached single sakura petal ("kelopak gugur putus")
         */
        createSingleFallenPetal(
          randomScreenPos = false,
          originX = null,
          originY = null,
          burst = false,
        ) {
          let x, y, vx, vy;
          if (originX !== null && originY !== null) {
            x = originX + (Math.random() - 0.5) * 14;
            y = originY + (Math.random() - 0.5) * 14;
            const ang = Math.random() * Math.PI * 2;
            const speed = burst
              ? 18 + Math.random() * 48
              : 12 + Math.random() * 24;
            vx = Math.cos(ang) * speed + 22 + Math.random() * 26;
            vy = Math.sin(ang) * speed * 0.65 + 10 + Math.random() * 18;
          } else if (randomScreenPos) {
            x = Math.random() * this.width;
            y = Math.random() * this.height;
            vx = 16 + Math.random() * 22;
            vy = 9 + Math.random() * 15;
          } else {
            // Re-enter gently from left or top edge on the warm summer breeze
            if (Math.random() < 0.52) {
              x = -24 - Math.random() * 80;
              y = Math.random() * this.height * 0.88;
            } else {
              x = Math.random() * this.width * 0.92;
              y = -24 - Math.random() * 60;
            }
            vx = 18 + Math.random() * 24;
            vy = 10 + Math.random() * 16;
          }

          return {
            x,
            y,
            vx,
            vy,
            size: 5.5 + Math.random() * 5.0,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 2.1,
            flipPhase: Math.random() * Math.PI * 2,
            flipSpeed: 1.5 + Math.random() * 2.0,
            swayPhase: Math.random() * Math.PI * 2,
            swayAmp: 12 + Math.random() * 18,
            alpha: 0.85 + Math.random() * 0.15,
            delay: burst ? Math.random() * 0.35 : 0,
            tone: Math.floor(Math.random() * 3),
          };
        }

        /**
         * ==========================================================================
         * PROCEDURAL ZOOMED-IN SAKURA TREE (EXACT SILHOUETTE FROM REFERENCE)
         * With tapered pointed branch tips ("ujung runcing") instead of blunt ends.
         * ==========================================================================
         */
        buildSakuraTree() {
          this.branches = [];
          this.decorativeBlossoms = [];
          const preservedPlucked = new Set(this.pluckedIds);

          const W = this.width;
          const H = this.height;
          const isMobile = W < 640;

          // Deterministic PRNG for consistent organic branch silhouettes across resizes
          let seed = 7319;
          const rand = () => {
            seed = (seed * 16807) % 2147483647;
            return (seed - 1) / 2147483646;
          };

          const addBranch = (opts) => {
            const branch = {
              id: this.branches.length,
              parentId: opts.parentId ?? null,
              parentT: opts.parentT ?? 1,
              p0: opts.p0,
              p1: opts.p1,
              p2: opts.p2,
              p3: opts.p3,
              rStart: opts.rStart,
              rEnd: opts.rEnd,
              depth: opts.depth,
              growStart: opts.growStart,
              growEnd: opts.growEnd,
              swayFreq: 0.55 + rand() * 0.35,
              swayPhase: rand() * Math.PI * 2,
              swayAmp: 0.0045 + opts.depth * 0.0065,
            };
            this.branches.push(branch);
            return branch;
          };

          // 1. Thick zoomed-in trunk anchored off the left edge
          const mainTrunk = addBranch({
            p0: { x: -W * 0.06, y: H * (isMobile ? 0.84 : 0.87) },
            p1: { x: W * 0.05, y: H * 0.66 },
            p2: { x: W * 0.13, y: H * 0.53 },
            p3: { x: W * (isMobile ? 0.24 : 0.22), y: H * 0.46 },
            rStart: Math.max(48, Math.min(W, H) * 0.095),
            rEnd: Math.max(20, Math.min(W, H) * 0.04),
            depth: 0,
            growStart: 0.0,
            growEnd: 0.32,
          });

          // 2. Primary gnarled boughs extending across the center of the viewport
          const primarySpecs = [
            {
              parent: mainTrunk,
              t: 0.88,
              c1: { x: W * 0.33, y: H * 0.35 },
              c2: { x: W * 0.49, y: H * 0.26 },
              end: { x: W * (isMobile ? 0.8 : 0.68), y: H * 0.28 },
              rRatio: 0.78,
              gStart: 0.22,
              gEnd: 0.58,
            },
            {
              parent: mainTrunk,
              t: 0.96,
              c1: { x: W * 0.36, y: H * 0.47 },
              c2: { x: W * 0.53, y: H * 0.51 },
              end: { x: W * (isMobile ? 0.85 : 0.76), y: H * 0.44 },
              rRatio: 0.84,
              gStart: 0.25,
              gEnd: 0.62,
            },
            {
              parent: mainTrunk,
              t: 0.72,
              c1: { x: W * 0.29, y: H * 0.56 },
              c2: { x: W * 0.45, y: H * 0.64 },
              end: { x: W * (isMobile ? 0.76 : 0.64), y: H * 0.62 },
              rRatio: 0.66,
              gStart: 0.2,
              gEnd: 0.55,
            },
            {
              parent: mainTrunk,
              t: 0.56,
              c1: { x: W * 0.19, y: H * 0.33 },
              c2: { x: W * 0.33, y: H * 0.2 },
              end: { x: W * (isMobile ? 0.6 : 0.5), y: H * 0.18 },
              rRatio: 0.62,
              gStart: 0.16,
              gEnd: 0.5,
            },
            {
              parent: mainTrunk,
              t: 0.38,
              c1: { x: W * 0.18, y: H * 0.68 },
              c2: { x: W * 0.32, y: H * 0.76 },
              end: { x: W * (isMobile ? 0.56 : 0.46), y: H * 0.74 },
              rRatio: 0.52,
              gStart: 0.14,
              gEnd: 0.48,
            },
          ];

          const primaryBranches = primarySpecs.map((cfg) => {
            const origin = this.evalCubic(cfg.parent, cfg.t);
            const baseR =
              (cfg.parent.rStart * (1 - cfg.t) + cfg.parent.rEnd * cfg.t) *
              cfg.rRatio;
            return addBranch({
              parentId: cfg.parent.id,
              parentT: cfg.t,
              p0: origin,
              p1: cfg.c1,
              p2: cfg.c2,
              p3: cfg.end,
              rStart: baseR,
              rEnd: 0, // Pointed tip ("runcing")
              depth: 1,
              growStart: cfg.gStart,
              growEnd: cfg.gEnd,
            });
          });

          // 3. Secondary & tertiary delicate twigs framing the central canopy
          primaryBranches.forEach((pBranch, idx) => {
            const subCount = idx < 3 ? 4 : 3;
            for (let s = 0; s < subCount; s++) {
              const tAttach = 0.32 + (s / (subCount - 1 || 1)) * 0.64;
              const origin = this.evalCubic(pBranch, tAttach);
              const tangent = this.evalCubicTangent(pBranch, tAttach);
              const baseAngle = Math.atan2(tangent.y, tangent.x);

              const side = (s % 2 === 0 ? -1 : 1) * (idx % 2 === 0 ? 1 : -1);
              const spreadAngle = baseAngle + side * (0.34 + rand() * 0.34);
              const length = Math.min(W, H) * (0.14 + rand() * 0.11);

              const endX = Math.min(
                W * 0.89,
                Math.max(W * 0.15, origin.x + Math.cos(spreadAngle) * length),
              );
              const endY = Math.min(
                H * 0.84,
                Math.max(H * 0.15, origin.y + Math.sin(spreadAngle) * length),
              );

              const rAt =
                pBranch.rStart *
                Math.pow(Math.max(0.08, 1 - tAttach), 0.78) *
                0.68;
              const gStart =
                pBranch.growStart +
                (pBranch.growEnd - pBranch.growStart) * tAttach * 0.82;
              const gEnd = Math.min(0.84, gStart + 0.22);

              const sec = addBranch({
                parentId: pBranch.id,
                parentT: tAttach,
                p0: origin,
                p1: {
                  x:
                    origin.x +
                    Math.cos(spreadAngle - side * 0.18) * length * 0.45,
                  y:
                    origin.y +
                    Math.sin(spreadAngle - side * 0.18) * length * 0.45,
                },
                p2: {
                  x:
                    origin.x +
                    Math.cos(spreadAngle + side * 0.12) * length * 0.78,
                  y:
                    origin.y +
                    Math.sin(spreadAngle + side * 0.12) * length * 0.78,
                },
                p3: { x: endX, y: endY },
                rStart: Math.max(3.2, rAt),
                rEnd: 0, // Pointed tip ("runcing")
                depth: 2,
                growStart: gStart,
                growEnd: gEnd,
              });

              // Two fine terminal twigs per secondary branch
              for (let tw = 0; tw < 2; tw++) {
                const twT = 0.46 + tw * 0.46;
                const twOrigin = this.evalCubic(sec, twT);
                const twTan = this.evalCubicTangent(sec, twT);
                const twBaseAng = Math.atan2(twTan.y, twTan.x);
                const twSide = tw === 0 ? -side : side;
                const twAng = twBaseAng + twSide * (0.34 + rand() * 0.34);
                const twLen = Math.min(W, H) * (0.065 + rand() * 0.055);

                const twEnd = {
                  x: Math.min(
                    W * 0.9,
                    Math.max(W * 0.14, twOrigin.x + Math.cos(twAng) * twLen),
                  ),
                  y: Math.min(
                    H * 0.85,
                    Math.max(H * 0.14, twOrigin.y + Math.sin(twAng) * twLen),
                  ),
                };

                addBranch({
                  parentId: sec.id,
                  parentT: twT,
                  p0: twOrigin,
                  p1: {
                    x: twOrigin.x + Math.cos(twAng) * twLen * 0.5,
                    y: twOrigin.y + Math.sin(twAng) * twLen * 0.5,
                  },
                  p2: {
                    x:
                      twOrigin.x +
                      Math.cos(twAng + twSide * 0.15) * twLen * 0.8,
                    y:
                      twOrigin.y +
                      Math.sin(twAng + twSide * 0.15) * twLen * 0.8,
                  },
                  p3: twEnd,
                  rStart: 2.1,
                  rEnd: 0, // Pointed tip ("runcing")
                  depth: 3,
                  growStart: Math.min(0.82, gStart + 0.1),
                  growEnd: Math.min(0.92, gEnd + 0.12),
                });
              }
            }
          });

          // 4. Airy white-tipped & soft blush decorative blossoms along twigs
          const twigBranches = this.branches.filter((b) => b.depth >= 2);
          twigBranches.forEach((b) => {
            const count = 2;
            for (let i = 0; i < count; i++) {
              const t = 0.38 + (i / count) * 0.56;
              const pos = this.evalCubic(b, t);
              const offsetAng = rand() * Math.PI * 2;
              const offsetDist = 3 + rand() * 10;

              const palettes = [
                {
                  tip: "#FFFFFF",
                  mid: "#FADADD",
                  center: "#F4A7B9",
                  stamen: "#C99A4E",
                },
                {
                  tip: "#FFFFFF",
                  mid: "#FCE8EC",
                  center: "#E67E96",
                  stamen: "#C99A4E",
                },
                {
                  tip: "#FFF9FA",
                  mid: "#F4A7B9",
                  center: "#FFFFFF",
                  stamen: "#B8893E",
                },
                {
                  tip: "#FFFFFF",
                  mid: "#FADADD",
                  center: "#FFFFFF",
                  stamen: "#C99A4E",
                },
              ];
              const pal = palettes[Math.floor(rand() * palettes.length)];
              this.decorativeBlossoms.push({
                branchId: b.id,
                t,
                dx: Math.cos(offsetAng) * offsetDist,
                dy: Math.sin(offsetAng) * offsetDist,
                radius: (isMobile ? 7.5 : 9.5) + rand() * 5.5,
                rotation: rand() * Math.PI * 2,
                bloomStart: b.growEnd - 0.04 + rand() * 0.05,
                palette: pal,
                isBud: rand() < 0.16,
                plucked: false,
                regrowScale: 1,
                hoverAmount: 0,
                x: pos.x,
                y: pos.y,
              });
            }
          });

          // 5. Place all 10 distinct interactive blossoms with generous spacing across central twigs
          this.placeTenBlossoms(preservedPlucked);
        }

        /**
         * Selects 10 well-spaced anchor points along the central twigs so every
         * blossom can be easily hovered and clicked without crowding.
         */
        placeTenBlossoms(preservedPlucked) {
          const W = this.width;
          const H = this.height;
          const isMobile = W < 640;

          const candidates = [];
          this.branches.forEach((b) => {
            if (b.depth < 1) return;
            const samples =
              b.depth === 3
                ? [0.6, 0.92]
                : b.depth === 2
                  ? [0.52, 0.88]
                  : [0.7, 0.92];
            samples.forEach((t) => {
              const pt = this.evalCubic(b, t);
              if (
                pt.x >= W * (isMobile ? 0.16 : 0.19) &&
                pt.x <= W * 0.86 &&
                pt.y >= H * 0.18 &&
                pt.y <= H * 0.81
              ) {
                candidates.push({
                  branchId: b.id,
                  t,
                  x: pt.x,
                  y: pt.y,
                  bloomStart: Math.min(0.92, b.growEnd + 0.01),
                });
              }
            });
          });

          const chosen = [];
          let minDist = Math.min(W, H) * (isMobile ? 0.145 : 0.165);

          candidates.sort((a, b) => a.x + a.y * 0.55 - (b.x + b.y * 0.55));

          for (let pass = 0; pass < 8 && chosen.length < 10; pass++) {
            for (let i = 0; i < candidates.length && chosen.length < 10; i++) {
              const c = candidates[i];
              if (chosen.includes(c)) continue;
              const tooClose = chosen.some(
                (item) => Math.hypot(item.x - c.x, item.y - c.y) < minDist,
              );
              if (!tooClose) {
                chosen.push(c);
              }
            }
            minDist *= 0.84;
          }

          // Order naturally from upper-left across to lower-right (1..10)
          chosen.sort((a, b) => a.x * 0.68 + a.y - (b.x * 0.68 + b.y));

          this.interactiveBlossoms = THINGS_I_LIKE.map((itemObj, idx) => {
            const spot = chosen[idx % chosen.length];
            const offAng = (idx * 1.9) % (Math.PI * 2);
            const offDist = 3.5 + (idx % 3) * 2.0;

            return {
              item: itemObj,
              indexNumber: idx + 1,
              branchId: spot.branchId,
              t: spot.t,
              dx: Math.cos(offAng) * offDist,
              dy: Math.sin(offAng) * offDist,
              baseRadius: isMobile ? 16.0 : 18.5,
              hitRadius: isMobile ? 31 : 29,
              rotation: (idx * 0.78) % (Math.PI * 2),
              bloomStart: Math.min(0.9, spot.bloomStart + (idx / 10) * 0.06),
              swayPhase: idx * 0.55,
              hoverAmount: 0,
              plucked: preservedPlucked.has(itemObj.id),
              regrowScale: preservedPlucked.has(itemObj.id) ? 0 : 1,
              x: spot.x,
              y: spot.y,
            };
          });
        }

        evalCubic(branch, t) {
          const mt = 1 - t;
          const mt2 = mt * mt;
          const t2 = t * t;
          return {
            x:
              mt2 * mt * branch.p0.x +
              3 * mt2 * t * branch.p1.x +
              3 * mt * t2 * branch.p2.x +
              t2 * t * branch.p3.x,
            y:
              mt2 * mt * branch.p0.y +
              3 * mt2 * t * branch.p1.y +
              3 * mt * t2 * branch.p2.y +
              t2 * t * branch.p3.y,
          };
        }

        evalCubicTangent(branch, t) {
          const mt = 1 - t;
          return {
            x:
              3 * mt * mt * (branch.p1.x - branch.p0.x) +
              6 * mt * t * (branch.p2.x - branch.p1.x) +
              3 * t * t * (branch.p3.x - branch.p2.x),
            y:
              3 * mt * mt * (branch.p1.y - branch.p0.y) +
              6 * mt * t * (branch.p2.y - branch.p1.y) +
              3 * t * t * (branch.p3.y - branch.p2.y),
          };
        }

        /**
         * Continuous, unhurried harmonic sway simulating a warm summer breeze
         */
        computeAnimatedBranches(timeSec) {
          const computed = new Array(this.branches.length);

          for (let i = 0; i < this.branches.length; i++) {
            const b = this.branches[i];

            const rawGrow =
              (this.growthProgress - b.growStart) /
              Math.max(0.001, b.growEnd - b.growStart);
            const clampedGrow = Math.max(0, Math.min(1, rawGrow));
            const easedGrow = 1 - Math.pow(1 - clampedGrow, 3);

            const gentleBreezeFactor = 1 + this.breezeWave * 0.85;
            const primarySway = Math.sin(timeSec * b.swayFreq + b.swayPhase);
            const secondarySway =
              Math.sin(timeSec * (b.swayFreq * 0.45) + b.swayPhase * 1.4) *
              0.45;
            const swayAngle =
              (primarySway + secondarySway) * b.swayAmp * gentleBreezeFactor;

            let p0 = { x: b.p0.x, y: b.p0.y };
            let parentAngle = 0;

            if (b.parentId !== null && computed[b.parentId]) {
              const parentComp = computed[b.parentId];
              p0 = this.evalCubic(parentComp, b.parentT);
              parentAngle = parentComp.totalAngle;
            }

            const totalAngle = parentAngle + swayAngle;
            const rotateRel = (pt) => {
              const rx = pt.x - b.p0.x;
              const ry = pt.y - b.p0.y;
              const cos = Math.cos(totalAngle);
              const sin = Math.sin(totalAngle);
              return {
                x: p0.x + rx * cos - ry * sin,
                y: p0.y + rx * sin + ry * cos,
              };
            };

            computed[i] = {
              ...b,
              p0,
              p1: rotateRel(b.p1),
              p2: rotateRel(b.p2),
              p3: rotateRel(b.p3),
              grow: easedGrow,
              totalAngle,
            };
          }

          return computed;
        }

        /**
         * Preserved hover interaction and floating frosted-white tooltip
         */
        updateHoverState() {
          const tooltip = document.getElementById("hoverTooltip");

          if (
            this.growthProgress < 0.72 ||
            this.isModalOpen() ||
            this.state !== "BLOOMING" ||
            this.branchesBare ||
            this.driftingBlossom
          ) {
            this.hoveredBlossom = null;
            this.canvas.style.cursor = "default";
            tooltip.style.opacity = "0";
            return;
          }

          let closest = null;
          let closestDist = Infinity;

          for (const flower of this.interactiveBlossoms) {
            if (flower.plucked || flower.regrowScale < 0.65) continue;
            const dist = Math.hypot(
              this.pointer.x - flower.x,
              this.pointer.y - flower.y,
            );
            if (dist <= flower.hitRadius && dist < closestDist) {
              closest = flower;
              closestDist = dist;
            }
          }

          this.hoveredBlossom = closest;

          if (closest) {
            this.canvas.style.cursor = "pointer";
            document.getElementById("tooltipIndex").textContent =
              `#${String(closest.indexNumber).padStart(2, "0")}`;
            document.getElementById("tooltipLabel").textContent =
              "Touch to release petal";
            const r = closest.baseRadius || 16;
            tooltip.style.left = `${closest.x}px`;
            tooltip.style.top = `${Math.max(76, closest.y - r - 8)}px`;
            tooltip.style.opacity = "1";
          } else {
            this.canvas.style.cursor = "default";
            tooltip.style.opacity = "0";
          }
        }

        /**
         * Smooth, gentle warm-summer-breeze detachment toward the viewer
         */
        releaseBlossom(flower) {
          flower.plucked = true;
          this.pluckedIds.add(flower.item.id);
          this.releasedIds.add(flower.item.id);
          this.updateCounterUI();
          this.updateHoverState();

          this.sound.playWarmBreezeLift();
          this.breezeWave = 1.0;

          // Subtle sunlit warm air currents drifting gently across the white canvas
          for (let i = 0; i < 8; i++) {
            this.breezeRibbons.push({
              x: flower.x - 140 - Math.random() * 180,
              y: flower.y + (Math.random() - 0.5) * this.height * 0.45,
              length: 120 + Math.random() * 160,
              speed: 150 + Math.random() * 110,
              amp: 10 + Math.random() * 14,
              freq: 0.012 + Math.random() * 0.008,
              phase: Math.random() * Math.PI * 2,
              alpha: 0.18 + Math.random() * 0.16,
              life: 0,
              maxLife: 2.3 + Math.random() * 0.7,
            });
          }

          // Initialize unhurried warm-breeze petal drift
          this.driftingBlossom = {
            flower,
            startX: flower.x,
            startY: flower.y,
            x: flower.x,
            y: flower.y,
            scale: 1.0,
            elapsed: 0,
            duration: 2.45,
            rotZ: flower.rotation,
            rotX: 0,
            rotY: 0,
            sCurveDir: flower.x > this.width * 0.52 ? -1 : 1,
            phase: Math.random() * Math.PI * 2,
          };
        }

        updateCounterUI() {
          const count = this.releasedIds.size;
          document.getElementById("counterLabel").textContent = `${count}/10`;
        }

        openQuoteModal(itemObj) {
          this.activeQuote = itemObj;
          document.getElementById("quoteBadge").textContent =
            `${String(itemObj.id).padStart(2, "0")} / 10`;
          document.getElementById("quoteText").textContent =
            `“${itemObj.text}”`;
          document.getElementById("quoteSource").textContent = itemObj.source;

          const modal = document.getElementById("quoteModal");
          const card = document.getElementById("quoteCard");
          modal.classList.remove("hidden");
          modal.classList.add("flex");

          card.classList.remove("animate-serene-reveal");
          void card.offsetWidth;
          card.classList.add("animate-serene-reveal");
        }

        closeQuoteModal() {
          const wasFinalNote =
            this.state === "BLOOMING" && this.releasedIds.size >= 10;
          const modal = document.getElementById("quoteModal");
          modal.classList.add("hidden");
          modal.classList.remove("flex");
          this.activeQuote = null;
          this.updateHoverState();

          if (wasFinalNote) {
            this.triggerFinalPetalScatter();
          }
        }

        /**
         * At 10/10: break apart all blossoms on the branches into individual single
         * detached petals ("kelopak gugur putus") that persist and keep drifting
         */
        triggerFinalPetalScatter() {
          this.state = "SCATTERED";
          this.branchesBare = true;
          this.breezeWave = 1.45;
          this.hoveredBlossom = null;
          this.canvas.style.cursor = "default";
          this.sound.playScatterWhisper();

          this.scatteredPetals = [];

          // Break every decorative blossom & bud into individual single fallen petals
          for (const db of this.decorativeBlossoms) {
            const count = db.isBud ? 2 : 5;
            for (let k = 0; k < count; k++) {
              this.scatteredPetals.push(
                this.createSingleFallenPetal(false, db.x, db.y, true),
              );
            }
          }

          // Add continuous ambient single fallen petals so the breeze stays lush indefinitely
          for (let i = 0; i < 48; i++) {
            this.scatteredPetals.push(this.createSingleFallenPetal(true));
          }

          // Warm breeze ribbons sweeping across the bare pointed branches
          for (let i = 0; i < 12; i++) {
            this.breezeRibbons.push({
              x: -100 - Math.random() * 200,
              y: this.height * (0.18 + Math.random() * 0.64),
              length: 140 + Math.random() * 180,
              speed: 170 + Math.random() * 120,
              amp: 12 + Math.random() * 14,
              freq: 0.012 + Math.random() * 0.008,
              phase: Math.random() * Math.PI * 2,
              alpha: 0.22 + Math.random() * 0.16,
              life: 0,
              maxLife: 2.6 + Math.random() * 0.8,
            });
          }
        }

        /**
         * Frame update loop (60 FPS)
         */
        update(dt, now) {
          if (this.growthProgress < 1) {
            this.growthProgress = Math.min(
              1,
              (now - this.growthStartTime) / this.growthDuration,
            );
          }

          if (this.breezeWave > 0) {
            this.breezeWave = Math.max(0, this.breezeWave - dt * 0.34);
          }

          // Smooth hover easing for the 10 blossoms
          for (const f of this.interactiveBlossoms) {
            const targetHover = this.hoveredBlossom === f ? 1 : 0;
            f.hoverAmount +=
              (targetHover - f.hoverAmount) * Math.min(1, dt * 9);
          }

          // Sunlit summer pollen motes drifting peacefully
          for (const m of this.pollenMotes) {
            m.phase += dt * 1.1;
            m.x += (m.vx + Math.sin(m.phase) * 6) * dt;
            m.y += (m.vy + Math.cos(m.phase * 0.8) * 5) * dt;

            if (m.x > this.width + 20) m.x = -20;
            if (m.x < -20) m.x = this.width + 20;
            if (m.y > this.height + 20) m.y = -20;
            if (m.y < -20) m.y = this.height + 20;
          }

          // Ambient single sakura petals floating in summer air
          const breezeMult = 1 + this.breezeWave * 1.35;
          for (let i = 0; i < this.ambientPetals.length; i++) {
            const p = this.ambientPetals[i];
            p.swayPhase += dt * 1.5;
            p.flipPhase += dt * p.flipSpeed;
            p.x += (p.vx * breezeMult + Math.sin(p.swayPhase) * 11) * dt;
            p.y += (p.vy + Math.cos(p.swayPhase * 0.75) * 7) * dt;
            p.rot += p.vRot * dt;

            if (p.x > this.width + 32 || p.y > this.height + 32) {
              this.ambientPetals[i] = this.createSingleFallenPetal(false);
            }
          }

          // Persistent single fallen petals ("kelopak gugur putus") after 10/10
          if (this.scatteredPetals.length > 0) {
            for (let i = 0; i < this.scatteredPetals.length; i++) {
              const sp = this.scatteredPetals[i];
              if (sp.delay > 0) {
                sp.delay -= dt;
                continue;
              }
              sp.swayPhase += dt * 1.75;
              sp.flipPhase += dt * sp.flipSpeed;

              // Settle smoothly from initial scatter burst into steady warm summer breeze
              sp.vx += (22 - sp.vx) * Math.min(1, dt * 0.85);
              sp.vy += (14 - sp.vy) * Math.min(1, dt * 0.85);

              sp.x += (sp.vx + Math.sin(sp.swayPhase) * sp.swayAmp * 0.65) * dt;
              sp.y += (sp.vy + Math.cos(sp.swayPhase * 0.8) * 9) * dt;
              sp.rot += sp.vRot * dt;

              // Continuously circulate fallen single petals across the screen
              if (sp.x > this.width + 36 || sp.y > this.height + 36) {
                this.scatteredPetals[i] = this.createSingleFallenPetal(false);
              }
            }
          }

          // Warm air breeze ribbons
          for (let i = this.breezeRibbons.length - 1; i >= 0; i--) {
            const r = this.breezeRibbons[i];
            r.life += dt;
            r.x += r.speed * dt;
            r.y -= 14 * dt;
            if (r.life >= r.maxLife) {
              this.breezeRibbons.splice(i, 1);
            }
          }

          // Smooth, unhurried warm-summer-breeze petal drift toward the viewer
          if (this.driftingBlossom) {
            const db = this.driftingBlossom;
            db.elapsed += dt;
            const t = Math.min(1, db.elapsed / db.duration);

            const ease = 0.5 - 0.5 * Math.cos(t * Math.PI);
            const liftArc = Math.sin(t * Math.PI) * 52;
            const sCurve =
              Math.sin(t * Math.PI * 1.5 + db.phase) * 34 * db.sCurveDir;

            const targetX = this.width * 0.5;
            const targetY = this.height * 0.48;

            db.x = db.startX + (targetX - db.startX) * ease + sCurve;
            db.y = db.startY + (targetY - db.startY) * ease - liftArc;
            db.scale = 1.0 + ease * 2.8;

            db.rotZ +=
              (0.85 + Math.sin(t * Math.PI) * 0.65) * db.sCurveDir * dt;
            db.rotX = Math.sin(t * Math.PI * 1.4) * 0.42;
            db.rotY = Math.cos(t * Math.PI * 1.2) * 0.38;

            if (t >= 1) {
              const releasedItem = db.flower.item;
              this.driftingBlossom = null;
              this.openQuoteModal(releasedItem);
            }
          }
        }

        /**
         * Draw luminous white summer daylight background & drifting pollen motes
         */
        drawBackground() {
          const ctx = this.ctx;

          const bgGrad = ctx.createLinearGradient(
            0,
            0,
            this.width,
            this.height,
          );
          bgGrad.addColorStop(0, "#FFFFFF");
          bgGrad.addColorStop(0.55, "#FEFCFB");
          bgGrad.addColorStop(1, "#FAF6F5");
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, this.width, this.height);

          const sunGrad = ctx.createRadialGradient(
            this.width * 0.36,
            this.height * 0.34,
            10,
            this.width * 0.36,
            this.height * 0.34,
            Math.max(this.width, this.height) * 0.65,
          );
          sunGrad.addColorStop(0, "rgba(255, 246, 248, 0.72)");
          sunGrad.addColorStop(0.5, "rgba(252, 248, 246, 0.25)");
          sunGrad.addColorStop(1, "rgba(255, 255, 255, 0)");
          ctx.fillStyle = sunGrad;
          ctx.fillRect(0, 0, this.width, this.height);

          for (const m of this.pollenMotes) {
            const pulse = 0.45 + 0.55 * Math.sin(m.phase * 1.4);
            ctx.save();
            ctx.beginPath();
            ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
            ctx.fillStyle = m.isGold
              ? `rgba(214, 174, 108, ${0.22 * pulse})`
              : `rgba(244, 167, 185, ${0.26 * pulse})`;
            ctx.fill();
            ctx.restore();
          }
        }

        /**
         * ==========================================================================
         * DRAW TAPERED ORGANIC SAKURA TRUNK, BOUGHS & TWIGS WITH POINTED TIPS ("RUNCING")
         * ==========================================================================
         */
        drawBranches(computedBranches) {
          const ctx = this.ctx;

          for (let i = 0; i < computedBranches.length; i++) {
            const b = computedBranches[i];
            if (b.grow <= 0.002) continue;

            const steps = b.depth === 0 ? 30 : b.depth === 1 ? 24 : 16;
            const leftPts = [];
            const rightPts = [];
            let tipApex = null;

            for (let s = 0; s <= steps; s++) {
              const frac = s / steps;
              const t = frac * b.grow;
              const pt = this.evalCubic(b, t);
              const tan = this.evalCubicTangent(b, t);
              const len = Math.hypot(tan.x, tan.y) || 1;
              const tx = tan.x / len;
              const ty = tan.y / len;
              const nx = -ty;
              const ny = tx;

              // Natural taper that narrows to a sharp, pointed tip (radius = 0) at the end
              let radius;
              if (b.depth === 0) {
                const growthTip =
                  b.grow < 1 ? Math.cos(frac * Math.PI * 0.5) : 1;
                radius =
                  (b.rStart + (b.rEnd - b.rStart) * t) *
                  (0.35 + 0.65 * growthTip);
              } else {
                // Smooth botanical taper reaching 0 at frac = 1 so every branch tip is pointed ("runcing")
                const lengthTaper = Math.pow(Math.max(0, 1 - t), 0.78);
                const tipPoint = Math.pow(Math.max(0, 1 - frac), 0.62);
                radius = b.rStart * lengthTaper * tipPoint;
              }

              if (s === steps && b.depth >= 1) {
                // Sharp pointed botanical apex extending slightly along the tangent
                const needleExtend = Math.min(7.5, b.rStart * 0.34) * b.grow;
                tipApex = {
                  x: pt.x + tx * needleExtend,
                  y: pt.y + ty * needleExtend,
                };
              } else {
                leftPts.push({ x: pt.x + nx * radius, y: pt.y + ny * radius });
                rightPts.push({ x: pt.x - nx * radius, y: pt.y - ny * radius });
              }
            }

            ctx.save();
            if (b.depth <= 1) {
              ctx.shadowColor = "rgba(60, 45, 50, 0.09)";
              ctx.shadowBlur = 14;
              ctx.shadowOffsetX = 4;
              ctx.shadowOffsetY = 8;
            }

            const barkGrad = ctx.createLinearGradient(
              b.p0.x,
              b.p0.y,
              b.p3.x,
              b.p3.y,
            );
            barkGrad.addColorStop(0, "#3F3134");
            barkGrad.addColorStop(0.55, "#59474A");
            barkGrad.addColorStop(1, "#735D61");

            ctx.fillStyle = barkGrad;
            ctx.beginPath();
            ctx.moveTo(leftPts[0].x, leftPts[0].y);
            for (let s = 1; s < leftPts.length; s++) {
              ctx.lineTo(leftPts[s].x, leftPts[s].y);
            }
            if (tipApex) {
              ctx.lineTo(tipApex.x, tipApex.y);
            }
            for (let s = rightPts.length - 1; s >= 0; s--) {
              ctx.lineTo(rightPts[s].x, rightPts[s].y);
            }
            ctx.closePath();
            ctx.fill();

            // Subtle warm sunlit rim highlight along upper contour of main boughs
            if (b.depth <= 1 && rightPts.length > 2) {
              ctx.shadowColor = "transparent";
              ctx.beginPath();
              ctx.moveTo(rightPts[0].x, rightPts[0].y);
              for (let s = 1; s < rightPts.length; s++) {
                ctx.lineTo(rightPts[s].x, rightPts[s].y);
              }
              if (tipApex) {
                ctx.lineTo(tipApex.x, tipApex.y);
              }
              ctx.strokeStyle = "rgba(250, 218, 221, 0.28)";
              ctx.lineWidth = b.depth === 0 ? 1.8 : 1.1;
              ctx.lineCap = "round";
              ctx.stroke();
            }

            ctx.restore();
          }
        }

        /**
         * Draw 5-petal sakura blossom (white-centered & white-tipped with blush)
         */
        drawSakuraBlossom(x, y, radius, rotation, palette, options = {}) {
          const ctx = this.ctx;
          const {
            scaleX = 1,
            scaleY = 1,
            alpha = 1,
            isInteractive = false,
            hoverBoost = 0,
            shadowOffsetY = 5,
            shadowBlur = 10,
            shadowAlpha = 0.09,
          } = options;

          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(rotation);
          ctx.scale(scaleX, scaleY);
          ctx.globalAlpha = alpha;

          ctx.shadowColor = `rgba(60, 45, 50, ${shadowAlpha + hoverBoost * 0.05})`;
          ctx.shadowBlur = shadowBlur + hoverBoost * 6;
          ctx.shadowOffsetX = shadowOffsetY * 0.35;
          ctx.shadowOffsetY = shadowOffsetY;

          for (let p = 0; p < 5; p++) {
            ctx.save();
            ctx.rotate((p * Math.PI * 2) / 5);

            const pGrad = ctx.createRadialGradient(
              0,
              -radius * 0.12,
              radius * 0.05,
              0,
              -radius * 0.55,
              radius * 1.02,
            );
            pGrad.addColorStop(0, palette.center);
            pGrad.addColorStop(0.46, palette.mid);
            pGrad.addColorStop(0.88, palette.tip);
            pGrad.addColorStop(1, "#FFFFFF");

            ctx.fillStyle = pGrad;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(
              -radius * 0.44,
              -radius * 0.25,
              -radius * 0.52,
              -radius * 0.78,
              -radius * 0.14,
              -radius * 0.98,
            );
            ctx.lineTo(0, -radius * 0.85);
            ctx.lineTo(radius * 0.14, -radius * 0.98);
            ctx.bezierCurveTo(
              radius * 0.52,
              -radius * 0.78,
              radius * 0.44,
              -radius * 0.25,
              0,
              0,
            );
            ctx.closePath();
            ctx.fill();

            ctx.shadowColor = "transparent";
            ctx.strokeStyle = isInteractive
              ? `rgba(230, 126, 150, ${0.42 + hoverBoost * 0.28})`
              : "rgba(244, 167, 185, 0.38)";
            ctx.lineWidth = isInteractive ? 0.95 : 0.7;
            ctx.stroke();

            ctx.restore();
          }

          ctx.shadowColor = "transparent";

          ctx.fillStyle = isInteractive ? "#FFFFFF" : "#FADADD";
          ctx.beginPath();
          ctx.arc(0, 0, radius * 0.17, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "rgba(230, 126, 150, 0.45)";
          ctx.lineWidth = 0.65;
          ctx.stroke();

          const stamenCount = isInteractive ? 9 : 6;
          for (let s = 0; s < stamenCount; s++) {
            const ang = (s * Math.PI * 2) / stamenCount + 0.25;
            const sLen = radius * (0.28 + (s % 2) * 0.09);
            const sx = Math.cos(ang) * sLen;
            const sy = Math.sin(ang) * sLen;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(sx, sy);
            ctx.strokeStyle = "rgba(230, 126, 150, 0.55)";
            ctx.lineWidth = 0.65;
            ctx.stroke();

            ctx.fillStyle = palette.stamen || "#C99A4E";
            ctx.beginPath();
            ctx.arc(sx, sy, Math.max(0.9, radius * 0.055), 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }

        /**
         * Draw decorative blossoms + the 10 interactive blossoms along the central twigs
         */
        drawTreeBlossoms(computedBranches, timeSec) {
          if (this.branchesBare) return;

          const ctx = this.ctx;

          // 1. Airy decorative blossoms
          for (const db of this.decorativeBlossoms) {
            if (db.plucked) continue;
            const rawBloom = (this.growthProgress - db.bloomStart) / 0.18;
            if (rawBloom <= 0) continue;
            const t = Math.min(1, rawBloom);
            const easeBloom = 1 - Math.pow(1 - t, 3);

            const branch = computedBranches[db.branchId];
            const anchor = this.evalCubic(branch, db.t);
            const flutter = Math.sin(timeSec * 1.2 + db.rotation) * 0.06;

            db.x = anchor.x + db.dx;
            db.y = anchor.y + db.dy;

            if (db.isBud) {
              ctx.save();
              ctx.translate(db.x, db.y);
              ctx.rotate(db.rotation + flutter);
              ctx.scale(easeBloom, easeBloom);
              ctx.fillStyle = "#FADADD";
              ctx.strokeStyle = "rgba(230, 126, 150, 0.45)";
              ctx.lineWidth = 0.75;
              ctx.beginPath();
              ctx.ellipse(
                0,
                0,
                db.radius * 0.34,
                db.radius * 0.56,
                0,
                0,
                Math.PI * 2,
              );
              ctx.fill();
              ctx.stroke();
              ctx.restore();
            } else {
              this.drawSakuraBlossom(
                db.x,
                db.y,
                db.radius * easeBloom,
                db.rotation + flutter,
                db.palette,
                {
                  alpha: 0.92,
                  shadowOffsetY: 3,
                  shadowBlur: 6,
                  shadowAlpha: 0.06,
                },
              );
            }
          }

          // 2. The 10 Interactive Blossoms
          const interactivePalette = {
            center: "#FFFFFF",
            mid: "#FADADD",
            tip: "#FFFFFF",
            stamen: "#C99A4E",
          };

          for (const ib of this.interactiveBlossoms) {
            const branch = computedBranches[ib.branchId];
            const anchor = this.evalCubic(branch, ib.t);
            ib.x = anchor.x + ib.dx;
            ib.y = anchor.y + ib.dy;

            const rawBloom = (this.growthProgress - ib.bloomStart) / 0.2;
            if (rawBloom <= 0) continue;

            // Subtle tiny stem node left behind once a blossom has detached
            if (ib.plucked) {
              ctx.save();
              ctx.fillStyle = "#735D61";
              ctx.beginPath();
              ctx.arc(ib.x, ib.y, 2.1, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "#FADADD";
              ctx.beginPath();
              ctx.arc(ib.x, ib.y, 1.0, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
              continue;
            }

            const bloomT = Math.min(1, rawBloom);
            const easeBloom = 1 - Math.pow(1 - bloomT, 3);
            const gentleBreathe =
              0.5 + 0.5 * Math.sin(timeSec * 1.8 + ib.swayPhase);
            const hoverBoost = ib.hoverAmount;

            const radius =
              ib.baseRadius *
              easeBloom *
              ib.regrowScale *
              (1 + gentleBreathe * 0.04 + hoverBoost * 0.22);

            const flutter =
              ib.rotation +
              Math.sin(timeSec * (1.3 + hoverBoost * 3.0) + ib.swayPhase) *
                (0.05 + hoverBoost * 0.09);

            // Delicate frosted-blush ring indicating interactivity
            if (bloomT >= 0.88 && ib.regrowScale >= 0.95) {
              ctx.save();
              ctx.beginPath();
              ctx.arc(
                ib.x,
                ib.y,
                radius * (1.28 + gentleBreathe * 0.18 + hoverBoost * 0.22),
                0,
                Math.PI * 2,
              );
              ctx.strokeStyle = `rgba(230, 126, 150, ${0.18 + gentleBreathe * 0.14 + hoverBoost * 0.36})`;
              ctx.lineWidth = 0.9 + hoverBoost * 0.7;
              ctx.stroke();
              ctx.restore();
            }

            this.drawSakuraBlossom(
              ib.x,
              ib.y,
              radius,
              flutter,
              interactivePalette,
              {
                alpha: 1,
                isInteractive: true,
                hoverBoost,
                shadowOffsetY: 5 + hoverBoost * 4,
                shadowBlur: 10 + hoverBoost * 6,
                shadowAlpha: 0.09,
              },
            );
          }
        }

        /**
         * Draw a single detached sakura petal ("kelopak tunggal gugur putus") — NOT a whole flower
         */
        drawSingleFallenPetal(p) {
          if (p.delay > 0) return;
          const ctx = this.ctx;
          const flipScale = 0.42 + 0.58 * Math.abs(Math.cos(p.flipPhase));
          const s = p.size;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.scale(1, flipScale);
          ctx.globalAlpha = p.alpha;

          ctx.shadowColor = "rgba(60, 45, 50, 0.07)";
          ctx.shadowBlur = 6;
          ctx.shadowOffsetY = 4;

          const grad = ctx.createRadialGradient(
            0,
            s * 0.25,
            0.5,
            0,
            0,
            s * 1.1,
          );
          if (p.tone === 0) {
            grad.addColorStop(0, "#F8C8D6");
            grad.addColorStop(0.65, "#FADADD");
            grad.addColorStop(1, "#FFFFFF");
          } else if (p.tone === 1) {
            grad.addColorStop(0, "#F4A7B9");
            grad.addColorStop(0.6, "#FCE8EE");
            grad.addColorStop(1, "#FFFFFF");
          } else {
            grad.addColorStop(0, "#FADADD");
            grad.addColorStop(0.7, "#FFF6F8");
            grad.addColorStop(1, "#FFFFFF");
          }

          ctx.fillStyle = grad;
          ctx.beginPath();
          // Pointed base of single sakura petal
          ctx.moveTo(0, s);
          ctx.bezierCurveTo(
            -s * 0.72,
            s * 0.35,
            -s * 0.78,
            -s * 0.62,
            -s * 0.2,
            -s * 0.98,
          );
          // Signature sakura petal tip cleft
          ctx.lineTo(0, -s * 0.76);
          ctx.lineTo(s * 0.2, -s * 0.98);
          ctx.bezierCurveTo(s * 0.78, -s * 0.62, s * 0.72, s * 0.35, 0, s);
          ctx.closePath();
          ctx.fill();

          ctx.shadowColor = "transparent";
          ctx.strokeStyle = "rgba(230, 138, 166, 0.42)";
          ctx.lineWidth = 0.68;
          ctx.stroke();

          ctx.restore();
        }

        /**
         * Draw ambient single petals, scattered single fallen petals (at 10/10),
         * warm breeze ribbons, and active detached blossom gliding in 3D
         */
        drawSummerBreezeAndFlight(timeSec) {
          const ctx = this.ctx;

          // 1. Ambient single sakura petals drifting lazily across the white sky
          for (const p of this.ambientPetals) {
            this.drawSingleFallenPetal(p);
          }

          // 2. Persistent scattered single fallen petals ("kelopak gugur putus") after 10/10
          for (const sp of this.scatteredPetals) {
            this.drawSingleFallenPetal(sp);
          }

          // 3. Delicate warm summer breeze ribbons
          for (const r of this.breezeRibbons) {
            const progress = r.life / r.maxLife;
            const fade = Math.sin(progress * Math.PI);
            ctx.save();
            ctx.beginPath();
            const segments = 18;
            for (let s = 0; s <= segments; s++) {
              const st = s / segments;
              const px = r.x + st * r.length;
              const py =
                r.y + Math.sin(px * r.freq + r.phase + timeSec * 2.5) * r.amp;
              if (s === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.strokeStyle = `rgba(244, 167, 185, ${r.alpha * fade})`;
            ctx.lineWidth = 1.25;
            ctx.lineCap = "round";
            ctx.stroke();
            ctx.restore();
          }

          // 4. Detached blossom gliding gracefully toward the viewer (1x -> 3.8x)
          if (this.driftingBlossom) {
            const db = this.driftingBlossom;
            const t = Math.min(1, db.elapsed / db.duration);
            const radius = db.flower.baseRadius * db.scale;

            const foreshortenX = Math.max(0.55, Math.cos(db.rotY));
            const foreshortenY = Math.max(0.55, Math.cos(db.rotX));
            const foregroundAlpha = t > 0.84 ? 1 - (t - 0.84) / 0.16 : 1;
            const elevation = (db.scale - 1) / 2.8;

            this.drawSakuraBlossom(
              db.x,
              db.y,
              radius,
              db.rotZ,
              {
                center: "#FFFFFF",
                mid: "#FADADD",
                tip: "#FFFFFF",
                stamen: "#C99A4E",
              },
              {
                scaleX: foreshortenX,
                scaleY: foreshortenY,
                alpha: Math.max(0, foregroundAlpha),
                isInteractive: true,
                hoverBoost: 0.4,
                shadowOffsetY: 12 + elevation * 26,
                shadowBlur: 14 + elevation * 22,
                shadowAlpha: 0.11,
              },
            );
          }
        }

        frame(now) {
          const dt = Math.min(0.05, (now - this.lastTimestamp) / 1000);
          this.lastTimestamp = now;
          const timeSec = now / 1000;

          this.update(dt, now);

          const computedBranches = this.computeAnimatedBranches(timeSec);

          this.drawBackground();
          this.drawBranches(computedBranches);
          this.drawTreeBlossoms(computedBranches, timeSec);
          this.drawSummerBreezeAndFlight(timeSec);

          if (
            this.hoveredBlossom &&
            !this.driftingBlossom &&
            !this.isModalOpen()
          ) {
            const r = this.hoveredBlossom.baseRadius || 16;
            const tooltip = document.getElementById("hoverTooltip");
            tooltip.style.left = `${this.hoveredBlossom.x}px`;
            tooltip.style.top = `${Math.max(76, this.hoveredBlossom.y - r - 8)}px`;
          }

          requestAnimationFrame((nextNow) => this.frame(nextNow));
        }

        start() {
          requestAnimationFrame((now) => {
            this.lastTimestamp = now;
            this.growthStartTime = now;
            this.frame(now);
          });
        }
      }

      window.onload = function () {
        const app = new SakuraExperience();
        app.start();
      };
    </script>
  </body>
